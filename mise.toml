[tools]
go = "1.27.0"
golangci-lint = "2.13.2"
bun = "1.4.4"

[env]
GOTOOLCHAIN = "local"
NEXT_TELEMETRY_DISABLED = "1"

[tasks.build]
description = "Build the CLI into bin/intern and the Web server with the embedded UI into bin/intern-web"
depends = ["frontend:build"]
run = ["go build -o bin/intern ./app/cli", "go build -tags webui -o bin/intern-web ./app/web"]

[tasks."frontend:install"]
description = "Install the Web frontend dependencies exactly as bun.lock records them"
dir = "{{config_root}}/app/web/frontend"
run = "bun install --frozen-lockfile"

[tasks."frontend:generate"]
description = "Regenerate the frontend OpenAPI client (types, fetch SDK, TanStack Query, Zod) from app/web/api/openapi.yaml"
depends = ["frontend:install"]
dir = "{{config_root}}/app/web/frontend"
run = "bun run generate"

[tasks."frontend:check"]
description = "Biome CI, TypeScript, Vitest, then the OpenAPI client drift check; stop on any failure"
depends = ["frontend:install"]
dir = "{{config_root}}/app/web/frontend"
run = ["bun run ci", "bun run typecheck", "bun run test", "bun run generate:check"]

[tasks."frontend:build"]
description = "Build the static export and stage it in app/web/internal/webui/dist for the webui embed"
depends = ["frontend:install"]
run = '''
#!/usr/bin/env sh
set -eu
# _next/static/<build id>/ is served as immutable, so the id follows the commit.
export INTERN_BUILD_ID="${INTERN_BUILD_ID:-$(git rev-parse --short=12 HEAD 2>/dev/null || echo dev)}"
(cd app/web/frontend && rm -rf out && bun run build)
rm -rf app/web/internal/webui/dist
cp -R app/web/frontend/out app/web/internal/webui/dist
'''

[tasks."frontend:e2e"]
description = "agent-browser end-to-end run against a real bin/intern-web with the embedded UI"
depends = ["build"]
dir = "{{config_root}}/app/web/frontend"
raw_args = true
run = '''
#!/usr/bin/env sh
exec bun e2e/run.ts "$@"
'''

[tasks."frontend:e2e:stack"]
description = "agent-browser end-to-end for the resource pages against the real Compose stack (MySQL 8.4.11 + PXB 8.4.0-7 + Pure-FTPd 1.0.54; amd64 emulation on arm64 hosts)"
dir = "{{config_root}}/app/web/frontend"
raw_args = true
run = '''
#!/usr/bin/env sh
exec bun e2e/f2.ts "$@"
'''

[tasks.run]
description = "Run the CLI (mise run run --help)"
raw_args = true
run = '''
#!/usr/bin/env sh
exec go run ./app/cli "$@"
'''

[tasks.test]
description = "Run shared, CLI, and Web regression tests"
run = "go test ./internal/... ./app/cli/... ./app/web/..."

[tasks."test:containers"]
description = "Run and verify every locked real-container profile"
raw_args = true
run = '''
#!/usr/bin/env sh
exec go run ./app/cli/cmd/quality-gate all "$@"
'''

[tasks."test:container"]
description = "Run and verify one real-container profile (default: mysql-9.7.1)"
raw_args = true
run = '''
#!/usr/bin/env sh
exec go run ./app/cli/cmd/quality-gate run --profile "${PROFILE:-mysql-9.7.1}" "$@"
'''

[tasks."lint:integration"]
description = "Lint production and integration code with the same rules"
run = "golangci-lint run --build-tags=integration ./internal/... ./app/cli/... ./app/web/..."

[tasks.lint]
description = "Run the configured golangci-lint checks"
run = "golangci-lint run ./internal/... ./app/cli/... ./app/web/..."

[tasks.fmt]
description = "Format Go source and imports with the project configuration"
run = "golangci-lint fmt ./internal/... ./app/cli/... ./app/web/..."

[tasks.check]
description = "Build, test with race detection, then lint; stop on any failure"
run = [
    "go build ./internal/... ./app/cli/... ./app/web/...",
    "go test -race ./internal/... ./app/cli/... ./app/web/...",
    { task = "lint" },
]

[tasks.generate]
description = "Regenerate SQLite bindings with pinned sqlc v1.30.0"
run = [
    "go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f internal/sqlc.yaml",
    "go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f app/web/sqlc.yaml",
]
