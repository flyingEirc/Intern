version: 2.1

# Functional port of .github/workflows/quality.yml. CircleCI is the active
# CI; the Actions workflow is manual-only (workflow_dispatch). CircleCI runs
# the same pinned toolchain, the same container matrix, the same verify
# gates and the same evidence allowlists, bound to the built commit SHA.
#
# Deliberate differences, all decided by the main session:
# - No `scope` job and no documentation-only skip: CircleCI always runs the
#   full required matrix (required=true on every pipeline). The profile list
#   below mirrors app/cli/internal/qualitygate/contract.json (same order);
#   keep the two in sync when profiles change.
# - The scripts read GITHUB_SHA; it is mapped from CIRCLE_SHA1 at run time
#   (export GITHUB_SHA="$CIRCLE_SHA1") and the scripts themselves stay untouched.
# - GitHub's job-level timeout-minutes has no CircleCI config equivalent
#   (max runtime is a plan setting). Each primary command carries a GNU
#   `timeout` equal to the Actions job limit, and long steps raise
#   no_output_timeout to that same limit.
# - Retention of uploaded artifacts and auto-cancel of redundant workflows
#   are web app settings, not config keys: set artifact retention to 7 days
#   under Plan > Usage Controls and enable Project Settings > Advanced >
#   Auto-cancel Redundant Workflows (full trigger setup: workflows section).

executors:
  native-amd64:
    machine:
      image: ubuntu-2404:current # Linux x86_64 VM with Docker preinstalled for Testcontainers
    resource_class: large # 4 vCPU / 15 GB, sized for MySQL 8.4/9.7, PXB and FTP containers
    environment:
      GOTOOLCHAIN: local

commands:
  install-go:
    description: Restore Go caches and install pinned Go 1.27.0 (official SHA256 verified)
    steps:
      - restore_cache:
          keys:
            - go-dist-1.27.0-linux-amd64-v1
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "internal/go.sum" }}-{{ checksum "app/cli/go.sum" }}-{{ checksum "app/web/go.sum" }}-{{ checksum "go.work.sum" }}
            - go-mod-v1-
      - run:
          name: Install pinned Go 1.27.0 (official SHA256 verified)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            archive="$HOME/.cache/downloads/go1.27.0.linux-amd64.tar.gz"
            expected='675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685'
            mkdir -p "$(dirname "$archive")"
            if [[ ! -f "$archive" ]]; then
              curl --fail --silent --show-error --location --retry 5 \
                --output "$archive" https://go.dev/dl/go1.27.0.linux-amd64.tar.gz
            fi
            echo "$expected  $archive" | sha256sum --check -
            sudo rm -rf /usr/local/go
            sudo tar --directory=/usr/local --extract --gzip --file="$archive"
            [[ "$(/usr/local/go/bin/go env GOVERSION)" == 'go1.27.0' ]]
            # GOTOOLCHAIN=local matches the workflow env and mise.toml.
            printf '%s\n' 'export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"' 'export GOTOOLCHAIN=local' >> "$BASH_ENV"
      - save_cache:
          key: go-dist-1.27.0-linux-amd64-v1
          paths:
            - ~/.cache/downloads

  save-go-caches:
    description: Save the Go module and build caches keyed on the go.sum files
    steps:
      - save_cache:
          key: go-mod-v1-{{ checksum "internal/go.sum" }}-{{ checksum "app/cli/go.sum" }}-{{ checksum "app/web/go.sum" }}-{{ checksum "go.work.sum" }}
          paths:
            - ~/go/pkg/mod
            - ~/.cache/go-build

jobs:
  quality-fast:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Build
          no_output_timeout: 20m
          command: timeout 20m go build ./internal/... ./app/cli/... ./app/web/...
      - run:
          name: Behavior and race tests
          no_output_timeout: 20m
          command: timeout 20m go test -race -shuffle=on ./internal/... ./app/cli/... ./app/web/...
      # The evidence gates are enforced per container job below; this step
      # exercises their accept and reject cases, including an empty GITHUB_SHA,
      # so a silently weakened gate fails the build instead of passing later.
      - run:
          name: W4 evidence gate accept and reject cases
          command: .github/scripts/w4-gate-cases.sh
      - run:
          name: P4 evidence gate accept and reject cases
          command: .github/scripts/p4-gate-cases.sh
      - run:
          name: W5 evidence gate accept and reject cases
          command: .github/scripts/w5-gate-cases.sh
      - run:
          name: D1 evidence gate accept and reject cases
          command: .github/scripts/d1-gate-cases.sh
      - run:
          name: S2 evidence gate accept and reject cases
          command: .github/scripts/s2-gate-cases.sh
      - run:
          name: Candidate artifact gate accept and reject cases
          command: .github/scripts/candidate-artifact-cases.sh
      - run:
          name: Publish the OpenAPI contract with its digest
          command: |
            set -euo pipefail
            mkdir -p .cache/contract
            cp app/web/api/openapi.yaml .cache/contract/openapi.yaml
            version=$(grep -m1 -E '^  version:' app/web/api/openapi.yaml | awk '{print $2}')
            test -n "$version"
            digest=$(sha256sum app/web/api/openapi.yaml | cut -d' ' -f1)
            printf 'source_sha=%s\ncontract=app/web/api/openapi.yaml\ninfo_version=%s\nsha256=%s\n' \
              "$CIRCLE_SHA1" "$version" "$digest" > .cache/contract/openapi.release
            cat .cache/contract/openapi.release
      - store_artifacts:
          path: .cache/contract
          destination: contract-openapi
      - run:
          name: Install pinned golangci-lint
          no_output_timeout: 20m
          command: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run:
          name: Lint including integration code
          no_output_timeout: 20m
          command: timeout 20m golangci-lint run --build-tags=integration ./internal/... ./app/cli/... ./app/web/...
      - save-go-caches

  container-mysql:
    parameters:
      profile:
        type: string
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Real CLI and database container scenarios
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            export INTERN_TEST_PROFILE='<< parameters.profile >>' \
                   INTERN_TEST_SOURCE_SHA="$CIRCLE_SHA1" \
                   INTERN_TEST_PLATFORM='linux/amd64' \
                   INTERN_TEST_REPORT_DIR="$PWD/.cache/quality/<< parameters.profile >>" \
                   INTERN_CONTAINER_PARALLEL='2'
            mkdir -p "$INTERN_TEST_REPORT_DIR"
            timeout 45m go test -json -tags=integration -count=1 -shuffle=on -parallel=2 -timeout=35m ./app/cli/integration/... | tee "$INTERN_TEST_REPORT_DIR/events.jsonl"
      - run:
          name: Reject incomplete or skipped scenario evidence
          when: always
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            export INTERN_TEST_PROFILE='<< parameters.profile >>' \
                   INTERN_TEST_SOURCE_SHA="$CIRCLE_SHA1" \
                   INTERN_TEST_PLATFORM='linux/amd64' \
                   INTERN_TEST_REPORT_DIR="$PWD/.cache/quality/<< parameters.profile >>"
            go run ./app/cli/cmd/quality-gate verify \
              --directory "$INTERN_TEST_REPORT_DIR" --profile "$INTERN_TEST_PROFILE" \
              --source "$INTERN_TEST_SOURCE_SHA" --platform "$INTERN_TEST_PLATFORM" --ci
      - run:
          name: Stage allowlisted evidence (container-<< parameters.profile >>)
          when: always
          command: |
            set -euo pipefail
            src="$PWD/.cache/quality/<< parameters.profile >>"
            dest="$PWD/.cache/downloaded/container-<< parameters.profile >>"
            # Same allowlist as actions/upload-artifact; a missing candidate or
            # event stream fails here like if-no-files-found: error.
            test -f "$src/candidate.json"
            test -f "$src/events.jsonl"
            mkdir -p "$dest/receipts"
            cp "$src/candidate.json" "$src/events.jsonl" "$dest/"
            shopt -s nullglob
            receipts=("$src"/receipts/*.json)
            if ((${#receipts[@]} > 0)); then cp "${receipts[@]}" "$dest/receipts/"; fi
      - store_artifacts:
          path: .cache/downloaded/container-<< parameters.profile >>
          destination: container-<< parameters.profile >>
      # Layout matches actions/download-artifact with pattern container-* into
      # .cache/downloaded: aggregate expects .cache/downloaded/container-<profile>/.
      - persist_to_workspace:
          root: .cache/downloaded
          paths:
            - container-<< parameters.profile >>
      - save-go-caches

  container-physical:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native physical runner and source preflight
          no_output_timeout: 25m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/physical
            timeout 25m go test -json -tags=integration -count=1 -timeout=16m ./app/web/integration -run '^TestP2NativeContainers$' | tee .cache/quality/physical/events.jsonl
      - run:
          name: Reject incomplete or skipped physical evidence
          when: always
          no_output_timeout: 25m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-physical-evidence.sh .cache/quality/physical/events.jsonl
      - store_artifacts:
          path: .cache/quality/physical/events.jsonl
          destination: physical-p2/events.jsonl
      - save-go-caches

  container-ftp:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native FTP publication and fault acceptance
          no_output_timeout: 20m
          command: |
            set -eo pipefail
            export INTERN_S1_ARCH=amd64
            mkdir -p .cache/quality/ftp
            timeout 20m go test -json -tags=integration -count=1 -timeout=14m ./app/web/integration -run '^TestS1NativeContainers$' | tee .cache/quality/ftp/events.jsonl
      - run:
          name: Reject incomplete or skipped FTP evidence
          when: always
          no_output_timeout: 20m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-ftp-evidence.sh .cache/quality/ftp/events.jsonl
      - store_artifacts:
          path: .cache/quality/ftp/events.jsonl
          destination: ftp-s1/events.jsonl
      - save-go-caches

  container-replication:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native replication, authentication and retention acceptance
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/replication
            timeout 35m go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestR1NativeContainers$' | tee .cache/quality/replication/events.jsonl
      - run:
          name: Reject incomplete or skipped replication evidence
          when: always
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-replication-evidence.sh .cache/quality/replication/events.jsonl
      - store_artifacts:
          path: .cache/quality/replication/events.jsonl
          destination: replication-r1/events.jsonl
      - save-go-caches

  container-web:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native Web resource, preflight and policy acceptance
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/web
            timeout 35m go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestW3NativeContainers$' | tee .cache/quality/web/events.jsonl
      - run:
          name: Reject incomplete or skipped Web evidence
          when: always
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-w3-evidence.sh .cache/quality/web/events.jsonl
      - store_artifacts:
          path: .cache/quality/web/events.jsonl
          destination: web-w3/events.jsonl
      - save-go-caches

  container-dispatch:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native dispatcher run, replica and SSE acceptance
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/dispatch
            timeout 45m go test -json -tags=integration -count=1 -timeout=40m ./app/web/integration -run '^TestW4NativeContainers$' | tee .cache/quality/dispatch/events.jsonl
      - run:
          name: Reject incomplete or skipped dispatcher evidence
          when: always
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-w4-evidence.sh .cache/quality/dispatch/events.jsonl
      - store_artifacts:
          path: .cache/quality/dispatch/events.jsonl
          destination: dispatch-w4/events.jsonl
      - save-go-caches

  container-restore:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native isolated restore acceptance
          no_output_timeout: 55m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/restore
            timeout 55m go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run '^TestP4NativeContainers$' | tee .cache/quality/restore/events.jsonl
      - run:
          name: Reject incomplete or skipped restore evidence
          when: always
          no_output_timeout: 55m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-p4-evidence.sh .cache/quality/restore/events.jsonl
      - store_artifacts:
          path: .cache/quality/restore/events.jsonl
          destination: restore-p4/events.jsonl
      - save-go-caches

  container-restore-api:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native restore API end to end
          no_output_timeout: 55m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/restore-api
            timeout 55m go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run '^TestW5NativeContainers$' | tee .cache/quality/restore-api/events.jsonl
      - run:
          name: Reject incomplete or skipped restore API evidence
          when: always
          no_output_timeout: 55m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-w5-evidence.sh .cache/quality/restore-api/events.jsonl
      - store_artifacts:
          path: .cache/quality/restore-api/events.jsonl
          destination: restore-api-w5/events.jsonl
      - save-go-caches

  # D1 deployment acceptance. It is the only job that builds the deployment
  # image and runs the repository Compose file with `docker compose`, so the
  # candidate-artifact evidence (image id, `docker save` digest, component
  # versions JSON) is captured here and stored for the G release gate to bind.
  container-deploy:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native Compose deployment acceptance
          no_output_timeout: 60m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/deploy
            export INTERN_D1_ARTIFACT_DIR="$PWD/.cache/quality/deploy"
            timeout 60m go test -json -tags=integration -count=1 -timeout=55m ./app/web/integration -run '^TestD1NativeContainers$' | tee .cache/quality/deploy/events.jsonl
      - run:
          name: Reject incomplete or skipped deployment evidence
          when: always
          no_output_timeout: 60m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-d1-evidence.sh .cache/quality/deploy/events.jsonl
      - run:
          name: Bind the candidate artifact to the run that wrote it
          when: always
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-candidate-artifact.sh .cache/quality/deploy/events.jsonl \
              .cache/quality/deploy/candidate-artifact.json internal/physical/compat.json
      - run:
          name: Stage allowlisted deployment evidence
          when: always
          command: |
            set -euo pipefail
            src="$PWD/.cache/quality/deploy"
            dest="$PWD/.cache/downloaded/deploy-d1"
            # Same allowlist as actions/upload-artifact: a missing candidate or
            # event stream fails here like if-no-files-found: error.
            test -f "$src/events.jsonl"
            test -f "$src/candidate-artifact.json"
            mkdir -p "$dest"
            cp "$src/events.jsonl" "$src/candidate-artifact.json" "$dest/"
      - store_artifacts:
          path: .cache/quality/deploy/events.jsonl
          destination: deploy-d1/events.jsonl
      - store_artifacts:
          path: .cache/quality/deploy/candidate-artifact.json
          destination: deploy-d1/candidate-artifact.json
      - save-go-caches

  # S2 FTPS acceptance. It is the only job that runs the six-face TLS fixture:
  # explicit and implicit FTPS against a real Pure-FTPd 1.0.54 (two daemons built from
  # the same pinned source, the second with IMPLICIT_TLS), every face behind an audit
  # tap that records whether a credential ever reached the server, the four certificate
  # refusals, the full + incremental chain replicated over FTPS to verified, and two
  # restores per face whose published exports this harness then starts in brand-new
  # pinned MySQL 8.4.11 containers. Emulated architectures are refused by the harness.
  container-ftps:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native FTPS container acceptance
          no_output_timeout: 85m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/ftps
            timeout 80m go test -json -tags=integration -count=1 -timeout=75m ./app/web/integration -run '^TestS2NativeContainers$' | tee .cache/quality/ftps/events.jsonl
      - run:
          name: Reject incomplete or skipped FTPS evidence
          when: always
          no_output_timeout: 5m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-s2-evidence.sh .cache/quality/ftps/events.jsonl
      - store_artifacts:
          path: .cache/quality/ftps/events.jsonl
          destination: ftps-s2/events.jsonl
      - save-go-caches

  quality-gate:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      # persist_to_workspace uses root .cache/downloaded, so the workspace holds
      # container-<profile>/ at its top level. Attaching at .cache/downloaded
      # restores the actions/download-artifact layout the aggregate reads.
      - attach_workspace:
          at: .cache/downloaded
      # requires blocks this job on any upstream failure, and no job is
      # optional, so the recorded outcomes are exactly success.
      - run:
          name: Verify the entire locked matrix for this exact commit
          no_output_timeout: 10m
          command: |
            set -eo pipefail
            timeout 10m go run ./app/cli/cmd/quality-gate aggregate \
              --directory .cache/downloaded --source "$CIRCLE_SHA1" --platform linux/amd64 \
              --required=true --scope success --fast success --containers success
      - save-go-caches

workflows:
  quality:
    # Triggered from the CircleCI web app; this file declares no `triggers:`
    # because scheduled workflows are not available for GitHub App pipelines.
    # One-time UI setup (Project Settings unless noted):
    #   1. Project Setup: install the CircleCI GitHub App and set up the
    #      project against .circleci/config.yml.
    #   2. Triggers: add a GitHub App trigger "All pushes" — every feature
    #      branch push, every PR branch push and main after each merge gets a
    #      pipeline (a future merge queue's gh-readonly-queue/* branches are
    #      ordinary branches and match the job filters below).
    #   3. Triggers: add a Schedule trigger for branch main at 03:23 UTC
    #      (cron "23 3 * * *"), the nightly run.
    #   4. Advanced: enable Auto-cancel Redundant Workflows.
    #   5. Plan > Usage Controls: set artifact retention to 7 days.
    # The job filters run every branch and tag push; manual ad-hoc runs use
    # the "Trigger Pipeline" action.
    jobs:
      - quality-fast:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-mysql:
          matrix:
            parameters:
              profile:
                - "mysql-9.7.1"
                - "mysql-8.4.11"
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-physical:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-ftp:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-replication:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-web:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-dispatch:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-restore:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-restore-api:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-deploy:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-ftps:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - quality-gate:
          requires:
            - quality-fast
            - container-mysql
            - container-physical
            - container-ftp
            - container-replication
            - container-web
            - container-dispatch
            - container-restore
            - container-restore-api
            - container-deploy
            - container-ftps
          filters: "pipeline.git.branch or pipeline.git.tag"
