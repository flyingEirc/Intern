version: 2.1

# Functional port of .github/workflows/quality.yml (which stays unchanged).
# GitHub Actions is the existing workflow; CircleCI is the active CI while
# Actions billing is blocked. It runs the same pinned toolchain, the same
# container matrix, the same verify gates and the same evidence allowlists,
# bound to the built commit SHA.
#
# Deliberate differences, all decided by the main session:
# - No `scope` job and no documentation-only skip: CircleCI always runs the
#   full required matrix (required=true on every pipeline). The profile list
#   below mirrors app/cli/internal/qualitygate/contract.json (same order);
#   keep the two in sync when profiles change.
# - The scripts read GITHUB_SHA; it is mapped from CIRCLE_SHA1 at run time
#   (export GITHUB_SHA="$CIRCLE_SHA1") and the scripts themselves stay untouched.
# - GitHub's job-level timeout-minutes has no CircleCI config equivalent
#   (max runtime is a plan setting). Each primary command carries a GNU
#   `timeout` equal to the Actions job limit, and long steps raise
#   no_output_timeout to that same limit.
# - Retention of uploaded artifacts (7 days in Actions) and auto-cancel of
#   redundant pipelines (Actions concurrency group) are CircleCI project
#   settings, not config keys; configure them once in Project Settings.

executors:
  native-amd64:
    machine:
      image: ubuntu-2404:current # Linux x86_64 VM with Docker preinstalled for Testcontainers
    resource_class: large # 4 vCPU / 15 GB, sized for MySQL 8.4/9.7, PXB and FTP containers
    environment:
      GOTOOLCHAIN: local

commands:
  install-go:
    description: Restore Go caches and install pinned Go 1.27.0 (official SHA256 verified)
    steps:
      - restore_cache:
          keys:
            - go-dist-1.27.0-linux-amd64-v1
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "internal/go.sum" }}-{{ checksum "app/cli/go.sum" }}-{{ checksum "app/web/go.sum" }}-{{ checksum "go.work.sum" }}
            - go-mod-v1-
      - run:
          name: Install pinned Go 1.27.0 (official SHA256 verified)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            archive="$HOME/.cache/downloads/go1.27.0.linux-amd64.tar.gz"
            expected='675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685'
            mkdir -p "$(dirname "$archive")"
            if [[ ! -f "$archive" ]]; then
              curl --fail --silent --show-error --location --retry 5 \
                --output "$archive" https://go.dev/dl/go1.27.0.linux-amd64.tar.gz
            fi
            echo "$expected  $archive" | sha256sum --check -
            sudo rm -rf /usr/local/go
            sudo tar --directory=/usr/local --extract --gzip --file="$archive"
            [[ "$(/usr/local/go/bin/go env GOVERSION)" == 'go1.27.0' ]]
            # GOTOOLCHAIN=local matches the workflow env and mise.toml.
            printf '%s\n' 'export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"' 'export GOTOOLCHAIN=local' >> "$BASH_ENV"
      - save_cache:
          key: go-dist-1.27.0-linux-amd64-v1
          paths:
            - ~/.cache/downloads

  save-go-caches:
    description: Save the Go module and build caches keyed on the go.sum files
    steps:
      - save_cache:
          key: go-mod-v1-{{ checksum "internal/go.sum" }}-{{ checksum "app/cli/go.sum" }}-{{ checksum "app/web/go.sum" }}-{{ checksum "go.work.sum" }}
          paths:
            - ~/go/pkg/mod
            - ~/.cache/go-build

jobs:
  quality-fast:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Build
          no_output_timeout: 20m
          command: timeout 20m go build ./internal/... ./app/cli/... ./app/web/...
      - run:
          name: Behavior and race tests
          no_output_timeout: 20m
          command: timeout 20m go test -race -shuffle=on ./internal/... ./app/cli/... ./app/web/...
      - run:
          name: Install pinned golangci-lint
          no_output_timeout: 20m
          command: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run:
          name: Lint including integration code
          no_output_timeout: 20m
          command: timeout 20m golangci-lint run --build-tags=integration ./internal/... ./app/cli/... ./app/web/...
      - save-go-caches

  container-mysql:
    parameters:
      profile:
        type: string
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Real CLI and database container scenarios
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            export INTERN_TEST_PROFILE='<< parameters.profile >>' \
                   INTERN_TEST_SOURCE_SHA="$CIRCLE_SHA1" \
                   INTERN_TEST_PLATFORM='linux/amd64' \
                   INTERN_TEST_REPORT_DIR="$PWD/.cache/quality/<< parameters.profile >>" \
                   INTERN_CONTAINER_PARALLEL='2'
            mkdir -p "$INTERN_TEST_REPORT_DIR"
            timeout 45m go test -json -tags=integration -count=1 -shuffle=on -parallel=2 -timeout=35m ./app/cli/integration/... | tee "$INTERN_TEST_REPORT_DIR/events.jsonl"
      - run:
          name: Reject incomplete or skipped scenario evidence
          when: always
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            export INTERN_TEST_PROFILE='<< parameters.profile >>' \
                   INTERN_TEST_SOURCE_SHA="$CIRCLE_SHA1" \
                   INTERN_TEST_PLATFORM='linux/amd64' \
                   INTERN_TEST_REPORT_DIR="$PWD/.cache/quality/<< parameters.profile >>"
            go run ./app/cli/cmd/quality-gate verify \
              --directory "$INTERN_TEST_REPORT_DIR" --profile "$INTERN_TEST_PROFILE" \
              --source "$INTERN_TEST_SOURCE_SHA" --platform "$INTERN_TEST_PLATFORM" --ci
      - run:
          name: Stage allowlisted evidence (container-<< parameters.profile >>)
          when: always
          command: |
            set -euo pipefail
            src="$PWD/.cache/quality/<< parameters.profile >>"
            dest="$PWD/.cache/downloaded/container-<< parameters.profile >>"
            # Same allowlist as actions/upload-artifact; a missing candidate or
            # event stream fails here like if-no-files-found: error.
            test -f "$src/candidate.json"
            test -f "$src/events.jsonl"
            mkdir -p "$dest/receipts"
            cp "$src/candidate.json" "$src/events.jsonl" "$dest/"
            shopt -s nullglob
            receipts=("$src"/receipts/*.json)
            if ((${#receipts[@]} > 0)); then cp "${receipts[@]}" "$dest/receipts/"; fi
      - store_artifacts:
          path: .cache/downloaded/container-<< parameters.profile >>
          destination: container-<< parameters.profile >>
      # Layout matches actions/download-artifact with pattern container-* into
      # .cache/downloaded: aggregate expects .cache/downloaded/container-<profile>/.
      - persist_to_workspace:
          root: .cache/downloaded
          paths:
            - container-<< parameters.profile >>
      - save-go-caches

  container-physical:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native physical runner and source preflight
          no_output_timeout: 25m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/physical
            timeout 25m go test -json -tags=integration -count=1 -timeout=16m ./app/web/integration -run '^TestP2NativeContainers$' | tee .cache/quality/physical/events.jsonl
      - run:
          name: Reject incomplete or skipped physical evidence
          when: always
          no_output_timeout: 25m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-physical-evidence.sh .cache/quality/physical/events.jsonl
      - store_artifacts:
          path: .cache/quality/physical/events.jsonl
          destination: physical-p2/events.jsonl
      - save-go-caches

  container-ftp:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native FTP publication and fault acceptance
          no_output_timeout: 20m
          command: |
            set -eo pipefail
            export INTERN_S1_ARCH=amd64
            mkdir -p .cache/quality/ftp
            timeout 20m go test -json -tags=integration -count=1 -timeout=14m ./app/web/integration -run '^TestS1NativeContainers$' | tee .cache/quality/ftp/events.jsonl
      - run:
          name: Reject incomplete or skipped FTP evidence
          when: always
          no_output_timeout: 20m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-ftp-evidence.sh .cache/quality/ftp/events.jsonl
      - store_artifacts:
          path: .cache/quality/ftp/events.jsonl
          destination: ftp-s1/events.jsonl
      - save-go-caches

  container-replication:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native replication, authentication and retention acceptance
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/replication
            timeout 35m go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestR1NativeContainers$' | tee .cache/quality/replication/events.jsonl
      - run:
          name: Reject incomplete or skipped replication evidence
          when: always
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-replication-evidence.sh .cache/quality/replication/events.jsonl
      - store_artifacts:
          path: .cache/quality/replication/events.jsonl
          destination: replication-r1/events.jsonl
      - save-go-caches

  container-web:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native Web resource, preflight and policy acceptance
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/web
            timeout 35m go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestW3NativeContainers$' | tee .cache/quality/web/events.jsonl
      - run:
          name: Reject incomplete or skipped Web evidence
          when: always
          no_output_timeout: 35m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-w3-evidence.sh .cache/quality/web/events.jsonl
      - store_artifacts:
          path: .cache/quality/web/events.jsonl
          destination: web-w3/events.jsonl
      - save-go-caches

  container-dispatch:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      - run:
          name: Native dispatcher run, replica and SSE acceptance
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            mkdir -p .cache/quality/dispatch
            timeout 45m go test -json -tags=integration -count=1 -timeout=40m ./app/web/integration -run '^TestW4NativeContainers$' | tee .cache/quality/dispatch/events.jsonl
      - run:
          name: Reject incomplete or skipped dispatcher evidence
          when: always
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            export GITHUB_SHA="$CIRCLE_SHA1"
            .github/scripts/verify-w4-evidence.sh .cache/quality/dispatch/events.jsonl
      - store_artifacts:
          path: .cache/quality/dispatch/events.jsonl
          destination: dispatch-w4/events.jsonl
      - save-go-caches

  quality-gate:
    executor: native-amd64
    steps:
      - checkout
      - install-go
      # .cache/downloaded/container-<profile>/ maps onto the layout that
      # actions/download-artifact produced for the quality-gate aggregate.
      - attach_workspace:
          at: .
      # requires blocks this job on any upstream failure, and no job is
      # optional, so the recorded outcomes are exactly success.
      - run:
          name: Verify the entire locked matrix for this exact commit
          no_output_timeout: 10m
          command: |
            set -eo pipefail
            timeout 10m go run ./app/cli/cmd/quality-gate aggregate \
              --directory .cache/downloaded --source "$CIRCLE_SHA1" --platform linux/amd64 \
              --required=true --scope success --fast success --containers success
      - save-go-caches

workflows:
  quality:
    # Nightly UTC run on main, matching the Actions schedule cron.
    triggers:
      - schedule:
          cron: "23 3 * * *"
          filters:
            branches:
              only:
                - main
    # Runs on every branch push and every tag push, matching Actions
    # on: push / pull_request / workflow_dispatch (PR branches push the same
    # commits; manual runs are the CircleCI "Trigger Pipeline" action).
    jobs:
      - quality-fast:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-mysql:
          matrix:
            parameters:
              profile:
                - "mysql-9.7.1"
                - "mysql-8.4.11"
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-physical:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-ftp:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-replication:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-web:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - container-dispatch:
          filters: "pipeline.git.branch or pipeline.git.tag"
      - quality-gate:
          requires:
            - quality-fast
            - container-mysql
            - container-physical
            - container-ftp
            - container-replication
            - container-web
            - container-dispatch
          filters: "pipeline.git.branch or pipeline.git.tag"
