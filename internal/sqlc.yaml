version: "2"
sql:
  - engine: "sqlite"
    schema: "catalog/migrations"
    queries: "catalog/queries.sql"
    gen:
      go:
        package: "catalogsql"
        out: "catalog/internal/catalogsql"
        emit_empty_slices: true
  - engine: "sqlite"
    schema: "physical/store/migrations"
    queries: "physical/store/queries.sql"
    gen:
      go:
        package: "storesql"
        out: "physical/store/internal/storesql"
        emit_empty_slices: true
