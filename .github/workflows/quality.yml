name: Intern quality

# The only CI for this repository, and the merge gate. Runs on the repository's
# self-hosted Linux x86_64 runner: a WSL2 Ubuntu 24.04 with a native Docker
# Engine on a Windows machine (prerequisites in docs/guide/quality.md, "CI
# execution environment"). That is the host layout the harness was written for
# (Linux paths, uid, bind-mount ownership; same shape as the former CircleCI
# machine executor ubuntu-2404 and the hosted ubuntu-24.04 runner), so go test
# runs on the host unchanged. Jobs that use the runner's tooling start with
# .github/scripts/require-runner.sh, which fails explicitly and names whatever
# the runner lacks.
#
# Every job selects that runner with one identical `runs-on` label set: the
# three default labels plus the custom `docker` and `wsl` labels the WSL2
# instances are registered with. The default trio alone is not specific enough
# on this machine: a Windows runner is also registered here, and a plain Linux
# runner without the native Docker engine would match it too. Both would fail
# the real-component gates, or hang until a job timeout. Only the instances
# configured for this harness carry `docker` and `wsl`, so a job cannot land on
# the Windows runner or on an under-provisioned Linux instance. All 13
# occurrences must stay byte-identical; .github/scripts/runner-labels-cases.sh
# is the single check that fails the fast tier when one drifts, when a job loses
# its runs-on, or when a new job is added without updating the count together.
#
# Triggers: push on every branch and tag, the nightly schedule on the default
# branch, and workflow_dispatch. Branch pushes are filtered with on.push.paths:
# a push that changes only documentation or the CI's own files creates no run
# at all. CI validates business code, not its own scripts: a change confined
# to .github/** (this workflow, the scripts, their self-tests, the templates)
# never starts a push run. Those scripts must pass their self-tests locally
# before the push (docs/workflow/pr.md) and still execute in the next business
# run or nightly, so a broken gate script is only exercised there. The filter
# mirrors the none/business split of .github/scripts/needs-ci.sh
# (needs-ci-cases.sh fails when they drift). GitHub does not evaluate path
# filters for pushes of tags, always runs a push it cannot diff (>1,000 commits
# or a diff timeout) and sees only the first 3,000 files of a larger diff, so
# scope keeps its own classification as the backstop of every run that is
# created. A push whose head commit message carries [skip ci] (or GitHub's
# other skip instructions) creates no push run; that never affects
# workflow_dispatch or schedule.
#
# Job tiers (scope, from quality-scope.sh): fast is quality-fast, cli is the
# container-mysql matrix with its aggregate gate, web is the nine Web container
# jobs. A push to a branch other than main runs fast only, so the single serial
# runner is not held ~52 minutes per branch push, and a push run is never
# merge-gate evidence. The pre-merge run is a workflow_dispatch on the PR branch
# at its head (docs/workflow/pr.md): it runs fast plus the container tiers the
# branch's diff over main reaches (needs-ci.sh tier cli, web or all), or every
# tier with the full input. main pushes with a business change, tags, the
# schedule and workflow_dispatch on main run every tier. Any of them with no
# business change since its base runs none, and quality-gate confirms each
# tier's outcome. No pull_request trigger: the dispatch run at the PR head SHA
# is the merge-gate evidence. Concurrency groups by event as well as ref, so a
# branch push never cancels that branch's dispatch run; it does not cancel main
# runs (each merge commit needs its own green run) and cancels superseded
# branch and tag runs of the same event. GitHub also emits a push event when a
# branch or tag is deleted (a branch deletion's run is attached to the default
# branch); CircleCI ran nothing on deletion. The scope and quality-gate jobs
# skip deleted events, so a deletion neither starts a matrix nor produces a
# gate result.
#
# The nine Web container jobs are chained into three lanes with `needs` so that
# jobs building images from the same Dockerfile never run at the same time on
# the shared Docker engine. Every container job used to depend only on scope, so
# a full run could start S1, W3 and R1 building ftp.Dockerfile (and P4, W5 and
# S2 building restore.Dockerfile) together. The lanes are:
#   A  container-ftp -> container-web -> container-replication  (ftp.Dockerfile)
#   B  container-restore -> container-restore-api -> container-ftps (restore/ftps Dockerfile)
#   C  container-physical -> container-deploy -> container-dispatch (root/deploy images, dispatcher)
# container-mysql (the cli tier) never joins a lane -- a lane must not cross a
# tier boundary, or a cli-only or web-only run would have a skipped upstream and
# quality-gate would reject the run -- but its two matrix legs are serialised
# with max-parallel: 1, capping the full run at four heavy jobs (three Web lanes
# plus one CLI profile) on this 10 GiB host.
# All four container entry points (the three lane heads and container-mysql)
# depend on [scope, quality-fast], so the fast tier's build, race tests and
# golangci-lint finish before any container job starts. Running lint beside the
# containers drove swap to 1.5 GiB (run 42355033628): golangci-lint took 25.2
# min and hit its timeout with 0 issues, while the first CLI profile's MySQL
# containers missed their 90 s readiness window. Staggering them removes that
# CPU/memory spike without relaxing either the readiness timeout or
# .golangci.yml's timeout. Lane-internal jobs inherit the barrier through their
# upstream. .github/scripts/runner-lanes-cases.sh asserts the lanes, the barrier,
# the tier boundary and the complete quality-gate needs list. Job-level
# `concurrency` was considered, but avoiding a canceled third pending job needs
# `queue: max`, which actionlint v1.7.12 rejects and which is documented only
# for workflow-level concurrency; `needs` lanes are deterministic instead.
# Known trade-off of the lanes: a job runs only when its upstream succeeded, so
# a failed lane head (or quality-fast) skips the rest of its lane. quality-gate
# still fails such a run, but the skipped jobs give no signal of their own; a
# rerun of the whole lane is needed to see them. A lane also adds up its jobs'
# wall clock (lane B can take up to 70 + 70 + 105 minutes).
#
# Differences from the former hosted-runner form: runs-on; the require-runner.sh
# step; setup-go with cache: false (the runner keeps its module and build caches
# between jobs); and timeouts raised by 15 minutes (scope 20, quality-fast 45)
# because the first run on a runner pulls every pinned image and module cold.
on:
  push:
    # A push that changes only documentation or the CI's own files creates no
    # run. The patterns mirror the case list of .github/scripts/needs-ci.sh:
    # every path is in scope, Markdown is out, .github/** is out, and the
    # business directories, the hook directory and the root go.* files are
    # re-included because a *.md below them needs CI (go.* also matches a root
    # go.md). Nothing re-includes .github/**, its Markdown included. A later
    # positive pattern re-includes a path an earlier ! pattern excluded. Tags
    # are not filtered: GitHub does not evaluate path filters for pushes of
    # tags.
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - 'internal/**'
      - 'app/**'
      - '.githooks/**'
      - 'go.*'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run every container tier, whatever the branch changes (a branch run otherwise runs only the tiers its diff over main reaches)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # main runs get one group per commit, so a merge commit's run is never
  # canceled or replaced by a later pending run; on any other branch or tag a
  # newer run of the same event cancels that ref's superseded run, and a branch
  # push does not cancel the branch's workflow_dispatch run.
  group: intern-quality-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash
    working-directory: .

env:
  GOTOOLCHAIN: local

jobs:
  scope:
    if: github.event.deleted != true
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 20
    outputs:
      fast: ${{ steps.scope.outputs.fast }}
      cli: ${{ steps.scope.outputs.cli }}
      web: ${{ steps.scope.outputs.web }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh
      - id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_INPUT: ${{ inputs.full }}
        run: .github/scripts/quality-scope.sh

  quality-fast:
    needs: scope
    if: needs.scope.outputs.fast == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --cc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build
        run: go build ./internal/... ./app/cli/... ./app/web/...
      - name: Behavior and race tests
        run: go test -race -shuffle=on ./internal/... ./app/cli/... ./app/web/...
      # The gates' own accept and reject cases, including an empty GITHUB_SHA,
      # run here too.
      - name: W4 evidence gate accept and reject cases
        run: .github/scripts/w4-gate-cases.sh
      # Self-test of the P4 gate.
      - name: P4 evidence gate accept and reject cases
        run: .github/scripts/p4-gate-cases.sh
      # Self-test of the W5 gate.
      - name: W5 evidence gate accept and reject cases
        run: .github/scripts/w5-gate-cases.sh
      # Self-test of the D1 gate.
      - name: D1 evidence gate accept and reject cases
        run: .github/scripts/d1-gate-cases.sh
      # Self-test of the S2 gate.
      - name: S2 evidence gate accept and reject cases
        run: .github/scripts/s2-gate-cases.sh
      - name: Candidate artifact gate accept and reject cases
        run: .github/scripts/candidate-artifact-cases.sh
      - name: Needs-CI classification accept and reject cases
        run: .github/scripts/needs-ci-cases.sh
      - name: Scope selection accept and reject cases
        run: .github/scripts/quality-scope-cases.sh
      # Every job must target the same WSL2 runner group (see the file header).
      - name: Runner label set accept and reject cases
        run: .github/scripts/runner-labels-cases.sh
      - name: Web container lane accept and reject cases
        run: .github/scripts/runner-lanes-cases.sh
      # The Web frontend (F1 #54): the same Bun as mise.toml, the frozen
      # lockfile, then Biome, TypeScript, Vitest and the OpenAPI client drift
      # check, and finally the static export embedded in a webui build.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Frontend install from the frozen lockfile
        working-directory: app/web/frontend
        run: bun install --frozen-lockfile
      - name: Frontend Biome, TypeScript, Vitest and OpenAPI client drift
        working-directory: app/web/frontend
        run: |
          set -euo pipefail
          bun run ci
          bun run typecheck
          bun run test
          bun run generate:check
      - name: Frontend static export embedded through the webui tag
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          INTERN_BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd app/web/frontend && bun run build)
          rm -rf app/web/internal/webui/dist
          cp -R app/web/frontend/out app/web/internal/webui/dist
          go build -tags webui -o .cache/intern-web-webui ./app/web
          go test -race -tags webui ./app/web/internal/webui/ ./app/web/cmd/
      - name: Publish the OpenAPI contract with its digest
        run: |
          set -euo pipefail
          mkdir -p .cache/contract
          cp app/web/api/openapi.yaml .cache/contract/openapi.yaml
          version=$(grep -m1 -E '^  version:' app/web/api/openapi.yaml | awk '{print $2}')
          test -n "$version"
          digest=$(sha256sum app/web/api/openapi.yaml | cut -d' ' -f1)
          printf 'source_sha=%s\ncontract=app/web/api/openapi.yaml\ninfo_version=%s\nsha256=%s\n' \
            "$GITHUB_SHA" "$version" "$digest" > .cache/contract/openapi.release
          cat .cache/contract/openapi.release
      - name: Retain the OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-openapi
          path: .cache/contract/
          if-no-files-found: error
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Lint including integration code
        run: golangci-lint run --build-tags=integration ./internal/... ./app/cli/... ./app/web/...
      # The export staged above lets the webui-tagged embed file compile.
      - name: Lint the webui build of the Web module
        run: golangci-lint run --build-tags=webui ./app/web/...

  container-mysql:
    needs: [scope, quality-fast]
    if: needs.scope.outputs.cli == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Both profiles initialise several MySQL containers each (the job itself
      # runs two cases in parallel). Running the two matrix legs together, on
      # top of the three Web lanes, exhausted the 10 GiB WSL VM: mysqld stayed
      # in "Initializing database files" past the 90 s readiness window and
      # swap was used (run 42343799557). Serialise the legs to cap the peak at
      # four heavy jobs; the readiness timeout stays untouched.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      INTERN_TEST_PROFILE: ${{ matrix.profile }}
      INTERN_TEST_SOURCE_SHA: ${{ github.sha }}
      INTERN_TEST_PLATFORM: linux/amd64
      INTERN_TEST_REPORT_DIR: ${{ github.workspace }}/.cache/quality/${{ matrix.profile }}
      INTERN_CONTAINER_PARALLEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      # Self-test of the cleanup below, with a fake docker: proves the script
      # removes only this runner's labelled resources and old candidate images.
      - name: CLI quality cleanup accept and reject cases
        timeout-minutes: 5
        run: .github/scripts/cli-quality-clean-cases.sh
      # Self-test of the stop step below, with real process groups: proves it
      # stops exactly the recorded group (SIGKILL for a child that ignores
      # SIGTERM), leaves unrelated processes alone and refuses a corrupt record.
      - name: CLI quality orphan test group stop cases
        timeout-minutes: 5
        run: .github/scripts/cli-quality-stop-test-cases.sh
      # Clear leftovers of an earlier cancelled job before starting new ones.
      - name: Remove CLI quality leftovers of earlier jobs
        timeout-minutes: 5
        run: .github/scripts/cli-quality-clean.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Real CLI and database container scenarios
        env:
          # Process group of the test pipeline, recorded by its leader for the
          # stop step below. RUNNER_TEMP is per job.
          INTERN_TEST_PGID_FILE: ${{ runner.temp }}/intern-cli-quality-test.pgid
        run: |
          mkdir -p "$INTERN_TEST_REPORT_DIR"
          # setsid starts `go test | tee` in a session and process group of its
          # own; the leader records that group id, and `wait` keeps this step's
          # exit status and evidence exactly as before (pipefail: a failing
          # go test fails the step even though tee succeeds). A cancelled step
          # leaves the group running; the always() step below stops that group.
          rm -f "$INTERN_TEST_PGID_FILE"
          setsid --wait bash -eo pipefail -c '
            printf "%s\n" "$$" > "$1"
            go test -json -tags=integration -count=1 -shuffle=on -parallel=2 -timeout=35m ./app/cli/integration/... | tee "$INTERN_TEST_REPORT_DIR/events.jsonl"
          ' _ "$INTERN_TEST_PGID_FILE" &
          wait $!
      # A cancelled test step leaves its process group running: stop exactly
      # that group before anything reads the evidence or the Docker resources.
      # After a completed test its group has already exited, which is a no-op.
      - name: Stop a test process group orphaned by a cancelled job
        if: always()
        timeout-minutes: 2
        env:
          INTERN_TEST_PGID_FILE: ${{ runner.temp }}/intern-cli-quality-test.pgid
        run: .github/scripts/cli-quality-stop-test.sh "$INTERN_TEST_PGID_FILE"
      - name: Reject incomplete or skipped scenario evidence
        if: always()
        run: |
          go run ./app/cli/cmd/quality-gate verify \
            --directory "$INTERN_TEST_REPORT_DIR" --profile "$INTERN_TEST_PROFILE" \
            --source "$INTERN_TEST_SOURCE_SHA" --platform "$INTERN_TEST_PLATFORM" --ci
      # A cancelled job never reaches t.Cleanup: its labelled containers,
      # networks and volumes survive until these steps run.
      - name: Remove this job's CLI quality resources
        if: always()
        timeout-minutes: 5
        run: .github/scripts/cli-quality-clean.sh
      - name: Fail if any labelled CLI quality resource remains
        if: always()
        timeout-minutes: 2
        run: .github/scripts/cli-quality-clean.sh --inventory
      - name: Retain only approved diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ matrix.profile }}
          # quality-gate downloads every container-* artifact by name. A re-run
          # of this job must replace this run's artifact instead of leaving a
          # partial one from a cancelled attempt for the gate to pick up.
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Only the explicit evidence allowlist below.
          path: |
            .cache/quality/${{ matrix.profile }}/candidate.json
            .cache/quality/${{ matrix.profile }}/events.jsonl
            .cache/quality/${{ matrix.profile }}/receipts/*.json

  container-physical:
    needs: [scope, quality-fast]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native physical runner and source preflight
        run: |
          mkdir -p .cache/quality/physical
          go test -json -tags=integration -count=1 -timeout=16m ./app/web/integration -run '^TestP2NativeContainers$' | tee .cache/quality/physical/events.jsonl
      - name: Reject incomplete or skipped physical evidence
        if: always()
        run: .github/scripts/verify-physical-evidence.sh .cache/quality/physical/events.jsonl
      - name: Retain allowlisted physical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-p2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/physical/events.jsonl

  container-ftp:
    needs: [scope, quality-fast]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native FTP publication and fault acceptance
        env:
          INTERN_S1_ARCH: amd64
        run: |
          mkdir -p .cache/quality/ftp
          go test -json -tags=integration -count=1 -timeout=14m ./app/web/integration -run '^TestS1NativeContainers$' | tee .cache/quality/ftp/events.jsonl
      - name: Reject incomplete or skipped FTP evidence
        if: always()
        run: .github/scripts/verify-ftp-evidence.sh .cache/quality/ftp/events.jsonl
      - name: Retain allowlisted FTP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftp-s1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/ftp/events.jsonl

  container-replication:
    needs: [scope, container-web]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native replication, authentication and retention acceptance
        run: |
          mkdir -p .cache/quality/replication
          go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestR1NativeContainers$' | tee .cache/quality/replication/events.jsonl
      - name: Reject incomplete or skipped replication evidence
        if: always()
        run: .github/scripts/verify-replication-evidence.sh .cache/quality/replication/events.jsonl
      - name: Retain allowlisted replication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replication-r1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/replication/events.jsonl

  container-web:
    needs: [scope, container-ftp]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native Web resource, preflight and policy acceptance
        run: |
          mkdir -p .cache/quality/web
          go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestW3NativeContainers$' | tee .cache/quality/web/events.jsonl
      - name: Reject incomplete or skipped Web evidence
        if: always()
        run: .github/scripts/verify-w3-evidence.sh .cache/quality/web/events.jsonl
      - name: Retain allowlisted Web evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-w3-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/web/events.jsonl

  container-dispatch:
    needs: [scope, container-deploy]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native dispatcher run, replica and SSE acceptance
        run: |
          mkdir -p .cache/quality/dispatch
          go test -json -tags=integration -count=1 -timeout=40m ./app/web/integration -run '^TestW4NativeContainers$' | tee .cache/quality/dispatch/events.jsonl
      - name: Reject incomplete or skipped dispatcher evidence
        if: always()
        run: .github/scripts/verify-w4-evidence.sh .cache/quality/dispatch/events.jsonl
      - name: Retain allowlisted dispatcher evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-w4-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/dispatch/events.jsonl

  container-restore:
    needs: [scope, quality-fast]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native isolated restore acceptance
        run: |
          mkdir -p .cache/quality/restore
          go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run '^TestP4NativeContainers$' | tee .cache/quality/restore/events.jsonl
      - name: Reject incomplete or skipped restore evidence
        if: always()
        run: .github/scripts/verify-p4-evidence.sh .cache/quality/restore/events.jsonl
      - name: Retain allowlisted restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-p4-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/restore/events.jsonl

  container-restore-api:
    needs: [scope, container-restore]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native restore API end to end
        run: |
          mkdir -p .cache/quality/restore-api
          go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run '^TestW5NativeContainers$' | tee .cache/quality/restore-api/events.jsonl
      - name: Reject incomplete or skipped restore API evidence
        if: always()
        run: .github/scripts/verify-w5-evidence.sh .cache/quality/restore-api/events.jsonl
      - name: Retain allowlisted restore API evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-api-w5-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/restore-api/events.jsonl

  # D1 deployment acceptance: the only job that builds the deployment image and
  # runs the repository Compose file with `docker compose`. The candidate-artifact
  # evidence (image id, `docker save` digest, component versions JSON) is captured
  # by the test and stored here for the release gate to bind. The test removes its
  # stack in t.Cleanup, which a cancelled job never reaches (the runner stops only
  # the step's shell, and the orphaned test is killed at the end of the job), while
  # the services restart: unless-stopped and the testcontainers reaper does not own
  # Compose resources. d1-compose-clean.sh therefore removes this runner's D1
  # Compose projects, and nothing else, before the test (leftovers of earlier jobs)
  # and after it with always().
  container-deploy:
    needs: [scope, container-physical]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 75
    env:
      INTERN_D1_ARTIFACT_DIR: ${{ github.workspace }}/.cache/quality/deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --compose
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      # Self-test of the cleanup script below: what it removes and what it must
      # never touch. It needs no Docker engine.
      - name: D1 cleanup scope accept and reject cases
        run: .github/scripts/d1-compose-clean-cases.sh
      - name: Remove D1 Compose stacks that earlier jobs of this runner left behind
        timeout-minutes: 5
        run: .github/scripts/d1-compose-clean.sh
      - name: Native Compose deployment acceptance
        run: |
          mkdir -p .cache/quality/deploy
          go test -json -tags=integration -count=1 -timeout=55m ./app/web/integration -run '^TestD1NativeContainers$' | tee .cache/quality/deploy/events.jsonl
      - name: Remove this job's D1 Compose stack
        if: always()
        timeout-minutes: 5
        run: .github/scripts/d1-compose-clean.sh
      - name: Reject incomplete or skipped deployment evidence
        if: always()
        run: .github/scripts/verify-d1-evidence.sh .cache/quality/deploy/events.jsonl
      - name: Bind the candidate artifact to the run that wrote it
        if: always()
        run: .github/scripts/verify-candidate-artifact.sh .cache/quality/deploy/events.jsonl .cache/quality/deploy/candidate-artifact.json internal/physical/compat.json
      - name: Retain allowlisted deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-d1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            .cache/quality/deploy/events.jsonl
            .cache/quality/deploy/candidate-artifact.json

  # S2 FTPS acceptance: the six-face TLS fixture, both FTPS modes, the four certificate
  # refusals with the server-side credential census, the chain replicated over FTPS and
  # the restores read back from that copy, with every published export started in a
  # brand-new pinned MySQL 8.4.11 container by the harness itself.
  container-ftps:
    needs: [scope, container-restore-api]
    if: needs.scope.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native FTPS container acceptance
        run: |
          mkdir -p .cache/quality/ftps
          go test -json -tags=integration -count=1 -timeout=80m ./app/web/integration -run '^TestS2NativeContainers$' | tee .cache/quality/ftps/events.jsonl
      - name: Reject incomplete or skipped FTPS evidence
        if: always()
        run: .github/scripts/verify-s2-evidence.sh .cache/quality/ftps/events.jsonl
      - name: Retain allowlisted FTPS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftps-s2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/ftps/events.jsonl

  quality-gate:
    name: quality-gate
    needs: [scope, quality-fast, container-mysql, container-physical, container-ftp, container-replication, container-web, container-dispatch, container-restore, container-restore-api, container-deploy, container-ftps]
    if: always() && github.event.deleted != true
    runs-on: [self-hosted, Linux, X64, docker, wsl]
    timeout-minutes: 10
    steps:
      # Every job of a tier the scope selected must succeed and every job of
      # the other tiers must be skipped, so a tier can neither be dropped
      # silently nor run outside its scope.
      - name: Validate job outcomes against the scope tiers
        env:
          SCOPE: ${{ needs.scope.result }}
          NEED_FAST: ${{ needs.scope.outputs.fast }}
          NEED_CLI: ${{ needs.scope.outputs.cli }}
          NEED_WEB: ${{ needs.scope.outputs.web }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
          PHYSICAL: ${{ needs.container-physical.result }}
          FTP: ${{ needs.container-ftp.result }}
          REPLICATION: ${{ needs.container-replication.result }}
          WEB: ${{ needs.container-web.result }}
          DISPATCH: ${{ needs.container-dispatch.result }}
          RESTORE: ${{ needs.container-restore.result }}
          RESTORE_API: ${{ needs.container-restore-api.result }}
          DEPLOY: ${{ needs.container-deploy.result }}
          FTPS: ${{ needs.container-ftps.result }}
        working-directory: .
        run: |
          test "$SCOPE" = success
          for need in "$NEED_FAST" "$NEED_CLI" "$NEED_WEB"; do
            case $need in
              true|false) ;;
              *) echo 'quality-gate: invalid scope tier output' >&2; exit 1 ;;
            esac
          done
          if [[ $NEED_FAST == false && ( $NEED_CLI == true || $NEED_WEB == true ) ]]; then
            echo 'quality-gate: a container tier without the fast checks' >&2
            exit 1
          fi
          # expect NEED JOB RESULT: success when the tier runs, skipped otherwise.
          expect() {
            local want=skipped
            [[ $1 == true ]] && want=success
            if [[ $3 != "$want" ]]; then
              printf 'quality-gate: %s is %s, want %s\n' "$2" "${3:-<none>}" "$want" >&2
              exit 1
            fi
          }
          expect "$NEED_FAST" quality-fast "$FAST"
          expect "$NEED_CLI" container-mysql "$CONTAINERS"
          expect "$NEED_WEB" container-physical "$PHYSICAL"
          expect "$NEED_WEB" container-ftp "$FTP"
          expect "$NEED_WEB" container-replication "$REPLICATION"
          expect "$NEED_WEB" container-web "$WEB"
          expect "$NEED_WEB" container-dispatch "$DISPATCH"
          expect "$NEED_WEB" container-restore "$RESTORE"
          expect "$NEED_WEB" container-restore-api "$RESTORE_API"
          expect "$NEED_WEB" container-deploy "$DEPLOY"
          expect "$NEED_WEB" container-ftps "$FTPS"
          printf 'quality-gate: tiers fast=%s cli=%s web=%s\n' "$NEED_FAST" "$NEED_CLI" "$NEED_WEB"
          if [[ $NEED_FAST == false ]]; then
            echo 'quality-gate: not-required (no business change)'
          elif [[ $NEED_CLI == false && $NEED_WEB == false ]]; then
            echo 'quality-gate: fast checks only, no container tier ran (not merge-gate evidence)'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.cli == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.scope.outputs.cli == 'true'
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.scope.outputs.cli == 'true'
        with:
          pattern: container-*
          path: .cache/downloaded
      - name: Verify the entire locked matrix for this exact commit
        if: needs.scope.outputs.cli == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ needs.scope.result }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
        run: |
          go run ./app/cli/cmd/quality-gate aggregate \
            --directory .cache/downloaded --source "$SOURCE_SHA" --platform linux/amd64 \
            --required=true --scope "$SCOPE" --fast "$FAST" --containers "$CONTAINERS"