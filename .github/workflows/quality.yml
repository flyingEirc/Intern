name: Intern quality

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: intern-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: Intern

env:
  GOTOOLCHAIN: local

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/quality-scope.sh

  quality-fast:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: |
            Intern/internal/go.sum
            Intern/app/cli/go.sum
            Intern/go.work.sum
      - name: Build
        run: go build ./internal/... ./app/cli/...
      - name: Behavior and race tests
        run: go test -race -shuffle=on ./internal/... ./app/cli/...
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Lint including integration code
        run: golangci-lint run --build-tags=integration ./internal/... ./app/cli/...

  container-mysql:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      INTERN_TEST_PROFILE: ${{ matrix.profile }}
      INTERN_TEST_SOURCE_SHA: ${{ github.sha }}
      INTERN_TEST_PLATFORM: linux/amd64
      INTERN_TEST_REPORT_DIR: ${{ github.workspace }}/Intern/.cache/quality/${{ matrix.profile }}
      INTERN_CONTAINER_PARALLEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: |
            Intern/internal/go.sum
            Intern/app/cli/go.sum
            Intern/go.work.sum
      - name: Real CLI and database container scenarios
        run: |
          mkdir -p "$INTERN_TEST_REPORT_DIR"
          go test -json -tags=integration -count=1 -shuffle=on -parallel=2 -timeout=20m ./app/cli/integration/... | tee "$INTERN_TEST_REPORT_DIR/events.jsonl"
      - name: Reject incomplete or skipped scenario evidence
        if: always()
        run: |
          go run ./app/cli/cmd/quality-gate verify \
            --directory "$INTERN_TEST_REPORT_DIR" --profile "$INTERN_TEST_PROFILE" \
            --source "$INTERN_TEST_SOURCE_SHA" --platform "$INTERN_TEST_PLATFORM" --ci
      - name: Retain only approved diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Only the explicit evidence allowlist below.
          path: |
            Intern/.cache/quality/${{ matrix.profile }}/candidate.json
            Intern/.cache/quality/${{ matrix.profile }}/events.jsonl
            Intern/.cache/quality/${{ matrix.profile }}/receipts/*.json

  quality-gate:
    name: quality-gate
    needs: [scope, quality-fast, container-mysql]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate job outcomes and documentation-only scope
        env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
        working-directory: .
        run: |
          test "$SCOPE" = success
          case "$REQUIRED" in
            true) test "$FAST" = success; test "$CONTAINERS" = success ;;
            false) test "$FAST" = skipped; test "$CONTAINERS" = skipped; echo 'quality-gate: not-required (documentation-only)' ;;
            *) echo 'quality-gate: invalid change classification' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.required == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.scope.outputs.required == 'true'
        with:
          go-version: '1.27.0'
          cache-dependency-path: |
            Intern/internal/go.sum
            Intern/app/cli/go.sum
            Intern/go.work.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.scope.outputs.required == 'true'
        with:
          pattern: container-*
          path: Intern/.cache/downloaded
      - name: Verify the entire locked matrix for this exact commit
        if: needs.scope.outputs.required == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ needs.scope.result }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
        run: |
          go run ./app/cli/cmd/quality-gate aggregate \
            --directory .cache/downloaded --source "$SOURCE_SHA" --platform linux/amd64 \
            --required=true --scope "$SCOPE" --fast "$FAST" --containers "$CONTAINERS"
