name: Intern quality

# The only CI for this repository, and the merge gate. Runs on the repository's
# self-hosted Linux x86_64 runner: a WSL2 Ubuntu 24.04 with a native Docker
# Engine on a Windows machine (prerequisites in docs/guide/quality.md, "CI
# execution environment"). That is the host layout the harness was written for
# (Linux paths, uid, bind-mount ownership; same shape as the former CircleCI
# machine executor ubuntu-2404 and the hosted ubuntu-24.04 runner), so go test
# runs on the host unchanged. Jobs that use the runner's tooling start with
# .github/scripts/require-runner.sh, which fails explicitly and names whatever
# the runner lacks.
#
# Triggers: push on every branch and tag, the nightly schedule on the default
# branch, and workflow_dispatch. No pull_request trigger: with one serial runner
# it would repeat every ~52-minute run for a same-repo PR branch push; the PR
# head SHA's push run is the merge-gate evidence. Concurrency does not cancel
# main runs (each merge commit needs its own green run) and cancels superseded
# branch and tag runs. GitHub also emits a push event when a branch or tag is
# deleted (a branch deletion's run is attached to the default branch); CircleCI
# ran nothing on deletion. The scope and quality-gate jobs skip deleted events,
# so a deletion neither starts a matrix nor produces a gate result. scope skips
# the heavy jobs only for documentation-only changes: on main the push delta,
# on other branches everything the branch has over main; never for tags,
# schedule or workflow_dispatch (quality-scope.sh). quality-gate confirms that
# outcome.
#
# Differences from the former hosted-runner form: runs-on; the require-runner.sh
# step; setup-go with cache: false (the runner keeps its module and build caches
# between jobs); and timeouts raised by 15 minutes (scope 20, quality-fast 45)
# because the first run on a runner pulls every pinned image and module cold.
on:
  push:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # main runs get one group per commit, so a merge commit's run is never
  # canceled or replaced by a later pending run; a newer push to any other
  # branch or tag cancels that ref's superseded run.
  group: intern-quality-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash
    working-directory: .

env:
  GOTOOLCHAIN: local

jobs:
  scope:
    if: github.event.deleted != true
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    outputs:
      required: ${{ steps.scope.outputs.required }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh
      - id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/quality-scope.sh

  quality-fast:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --cc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build
        run: go build ./internal/... ./app/cli/... ./app/web/...
      - name: Behavior and race tests
        run: go test -race -shuffle=on ./internal/... ./app/cli/... ./app/web/...
      # The gates' own accept and reject cases, including an empty GITHUB_SHA,
      # run here too.
      - name: W4 evidence gate accept and reject cases
        run: .github/scripts/w4-gate-cases.sh
      # Self-test of the P4 gate.
      - name: P4 evidence gate accept and reject cases
        run: .github/scripts/p4-gate-cases.sh
      # Self-test of the W5 gate.
      - name: W5 evidence gate accept and reject cases
        run: .github/scripts/w5-gate-cases.sh
      # Self-test of the D1 gate.
      - name: D1 evidence gate accept and reject cases
        run: .github/scripts/d1-gate-cases.sh
      # Self-test of the S2 gate.
      - name: S2 evidence gate accept and reject cases
        run: .github/scripts/s2-gate-cases.sh
      - name: Candidate artifact gate accept and reject cases
        run: .github/scripts/candidate-artifact-cases.sh
      - name: Scope selection accept and reject cases
        run: .github/scripts/quality-scope-cases.sh
      - name: Publish the OpenAPI contract with its digest
        run: |
          set -euo pipefail
          mkdir -p .cache/contract
          cp app/web/api/openapi.yaml .cache/contract/openapi.yaml
          version=$(grep -m1 -E '^  version:' app/web/api/openapi.yaml | awk '{print $2}')
          test -n "$version"
          digest=$(sha256sum app/web/api/openapi.yaml | cut -d' ' -f1)
          printf 'source_sha=%s\ncontract=app/web/api/openapi.yaml\ninfo_version=%s\nsha256=%s\n' \
            "$GITHUB_SHA" "$version" "$digest" > .cache/contract/openapi.release
          cat .cache/contract/openapi.release
      - name: Retain the OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-openapi
          path: .cache/contract/
          if-no-files-found: error
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Lint including integration code
        run: golangci-lint run --build-tags=integration ./internal/... ./app/cli/... ./app/web/...

  container-mysql:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      INTERN_TEST_PROFILE: ${{ matrix.profile }}
      INTERN_TEST_SOURCE_SHA: ${{ github.sha }}
      INTERN_TEST_PLATFORM: linux/amd64
      INTERN_TEST_REPORT_DIR: ${{ github.workspace }}/.cache/quality/${{ matrix.profile }}
      INTERN_CONTAINER_PARALLEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      # Self-test of the cleanup below, with a fake docker: proves the script
      # removes only this runner's labelled resources and old candidate images.
      - name: CLI quality cleanup accept and reject cases
        timeout-minutes: 5
        run: .github/scripts/cli-quality-clean-cases.sh
      # Clear leftovers of an earlier cancelled job before starting new ones.
      - name: Remove CLI quality leftovers of earlier jobs
        timeout-minutes: 5
        run: .github/scripts/cli-quality-clean.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Real CLI and database container scenarios
        run: |
          mkdir -p "$INTERN_TEST_REPORT_DIR"
          go test -json -tags=integration -count=1 -shuffle=on -parallel=2 -timeout=35m ./app/cli/integration/... | tee "$INTERN_TEST_REPORT_DIR/events.jsonl"
      - name: Reject incomplete or skipped scenario evidence
        if: always()
        run: |
          go run ./app/cli/cmd/quality-gate verify \
            --directory "$INTERN_TEST_REPORT_DIR" --profile "$INTERN_TEST_PROFILE" \
            --source "$INTERN_TEST_SOURCE_SHA" --platform "$INTERN_TEST_PLATFORM" --ci
      # A cancelled job never reaches t.Cleanup: its labelled containers,
      # networks and volumes survive until these steps run.
      - name: Remove this job's CLI quality resources
        if: always()
        timeout-minutes: 5
        run: .github/scripts/cli-quality-clean.sh
      - name: Fail if any labelled CLI quality resource remains
        if: always()
        timeout-minutes: 2
        run: .github/scripts/cli-quality-clean.sh --inventory
      - name: Retain only approved diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Only the explicit evidence allowlist below.
          path: |
            .cache/quality/${{ matrix.profile }}/candidate.json
            .cache/quality/${{ matrix.profile }}/events.jsonl
            .cache/quality/${{ matrix.profile }}/receipts/*.json

  container-physical:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native physical runner and source preflight
        run: |
          mkdir -p .cache/quality/physical
          go test -json -tags=integration -count=1 -timeout=16m ./app/web/integration -run '^TestP2NativeContainers$' | tee .cache/quality/physical/events.jsonl
      - name: Reject incomplete or skipped physical evidence
        if: always()
        run: .github/scripts/verify-physical-evidence.sh .cache/quality/physical/events.jsonl
      - name: Retain allowlisted physical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-p2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/physical/events.jsonl

  container-ftp:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native FTP publication and fault acceptance
        env:
          INTERN_S1_ARCH: amd64
        run: |
          mkdir -p .cache/quality/ftp
          go test -json -tags=integration -count=1 -timeout=14m ./app/web/integration -run '^TestS1NativeContainers$' | tee .cache/quality/ftp/events.jsonl
      - name: Reject incomplete or skipped FTP evidence
        if: always()
        run: .github/scripts/verify-ftp-evidence.sh .cache/quality/ftp/events.jsonl
      - name: Retain allowlisted FTP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftp-s1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/ftp/events.jsonl

  container-replication:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native replication, authentication and retention acceptance
        run: |
          mkdir -p .cache/quality/replication
          go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestR1NativeContainers$' | tee .cache/quality/replication/events.jsonl
      - name: Reject incomplete or skipped replication evidence
        if: always()
        run: .github/scripts/verify-replication-evidence.sh .cache/quality/replication/events.jsonl
      - name: Retain allowlisted replication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replication-r1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/replication/events.jsonl

  container-web:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native Web resource, preflight and policy acceptance
        run: |
          mkdir -p .cache/quality/web
          go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run '^TestW3NativeContainers$' | tee .cache/quality/web/events.jsonl
      - name: Reject incomplete or skipped Web evidence
        if: always()
        run: .github/scripts/verify-w3-evidence.sh .cache/quality/web/events.jsonl
      - name: Retain allowlisted Web evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-w3-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/web/events.jsonl

  container-dispatch:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native dispatcher run, replica and SSE acceptance
        run: |
          mkdir -p .cache/quality/dispatch
          go test -json -tags=integration -count=1 -timeout=40m ./app/web/integration -run '^TestW4NativeContainers$' | tee .cache/quality/dispatch/events.jsonl
      - name: Reject incomplete or skipped dispatcher evidence
        if: always()
        run: .github/scripts/verify-w4-evidence.sh .cache/quality/dispatch/events.jsonl
      - name: Retain allowlisted dispatcher evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-w4-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/dispatch/events.jsonl

  container-restore:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native isolated restore acceptance
        run: |
          mkdir -p .cache/quality/restore
          go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run '^TestP4NativeContainers$' | tee .cache/quality/restore/events.jsonl
      - name: Reject incomplete or skipped restore evidence
        if: always()
        run: .github/scripts/verify-p4-evidence.sh .cache/quality/restore/events.jsonl
      - name: Retain allowlisted restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-p4-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/restore/events.jsonl

  container-restore-api:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native restore API end to end
        run: |
          mkdir -p .cache/quality/restore-api
          go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run '^TestW5NativeContainers$' | tee .cache/quality/restore-api/events.jsonl
      - name: Reject incomplete or skipped restore API evidence
        if: always()
        run: .github/scripts/verify-w5-evidence.sh .cache/quality/restore-api/events.jsonl
      - name: Retain allowlisted restore API evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-api-w5-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/restore-api/events.jsonl

  # D1 deployment acceptance: the only job that builds the deployment image and
  # runs the repository Compose file with `docker compose`. The candidate-artifact
  # evidence (image id, `docker save` digest, component versions JSON) is captured
  # by the test and stored here for the release gate to bind.
  container-deploy:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 75
    env:
      INTERN_D1_ARTIFACT_DIR: ${{ github.workspace }}/.cache/quality/deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --compose
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native Compose deployment acceptance
        run: |
          mkdir -p .cache/quality/deploy
          go test -json -tags=integration -count=1 -timeout=55m ./app/web/integration -run '^TestD1NativeContainers$' | tee .cache/quality/deploy/events.jsonl
      - name: Reject incomplete or skipped deployment evidence
        if: always()
        run: .github/scripts/verify-d1-evidence.sh .cache/quality/deploy/events.jsonl
      - name: Bind the candidate artifact to the run that wrote it
        if: always()
        run: .github/scripts/verify-candidate-artifact.sh .cache/quality/deploy/events.jsonl .cache/quality/deploy/candidate-artifact.json internal/physical/compat.json
      - name: Retain allowlisted deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-d1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            .cache/quality/deploy/events.jsonl
            .cache/quality/deploy/candidate-artifact.json

  # S2 FTPS acceptance: the six-face TLS fixture, both FTPS modes, the four certificate
  # refusals with the server-side credential census, the chain replicated over FTPS and
  # the restores read back from that copy, with every published export started in a
  # brand-new pinned MySQL 8.4.11 container by the harness itself.
  container-ftps:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner prerequisites
        run: .github/scripts/require-runner.sh --docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native FTPS container acceptance
        run: |
          mkdir -p .cache/quality/ftps
          go test -json -tags=integration -count=1 -timeout=80m ./app/web/integration -run '^TestS2NativeContainers$' | tee .cache/quality/ftps/events.jsonl
      - name: Reject incomplete or skipped FTPS evidence
        if: always()
        run: .github/scripts/verify-s2-evidence.sh .cache/quality/ftps/events.jsonl
      - name: Retain allowlisted FTPS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftps-s2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/ftps/events.jsonl

  quality-gate:
    name: quality-gate
    needs: [scope, quality-fast, container-mysql, container-physical, container-ftp, container-replication, container-web, container-dispatch, container-restore, container-restore-api, container-deploy, container-ftps]
    if: always() && github.event.deleted != true
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Validate job outcomes and documentation-only scope
        env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
          PHYSICAL: ${{ needs.container-physical.result }}
          FTP: ${{ needs.container-ftp.result }}
          REPLICATION: ${{ needs.container-replication.result }}
          WEB: ${{ needs.container-web.result }}
          DISPATCH: ${{ needs.container-dispatch.result }}
          RESTORE: ${{ needs.container-restore.result }}
          RESTORE_API: ${{ needs.container-restore-api.result }}
          DEPLOY: ${{ needs.container-deploy.result }}
          FTPS: ${{ needs.container-ftps.result }}
        working-directory: .
        run: |
          test "$SCOPE" = success
          case "$REQUIRED" in
            true) test "$FAST" = success; test "$CONTAINERS" = success; test "$PHYSICAL" = success; test "$FTP" = success; test "$REPLICATION" = success; test "$WEB" = success; test "$DISPATCH" = success; test "$RESTORE" = success; test "$RESTORE_API" = success; test "$DEPLOY" = success; test "$FTPS" = success ;;
            false) test "$FAST" = skipped; test "$CONTAINERS" = skipped; test "$PHYSICAL" = skipped; test "$FTP" = skipped; test "$REPLICATION" = skipped; test "$WEB" = skipped; test "$DISPATCH" = skipped; test "$RESTORE" = skipped; test "$RESTORE_API" = skipped; test "$DEPLOY" = skipped; test "$FTPS" = skipped; echo 'quality-gate: not-required (documentation-only)' ;;
            *) echo 'quality-gate: invalid change classification' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.required == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.scope.outputs.required == 'true'
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.scope.outputs.required == 'true'
        with:
          pattern: container-*
          path: .cache/downloaded
      - name: Verify the entire locked matrix for this exact commit
        if: needs.scope.outputs.required == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ needs.scope.result }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
        run: |
          go run ./app/cli/cmd/quality-gate aggregate \
            --directory .cache/downloaded --source "$SOURCE_SHA" --platform linux/amd64 \
            --required=true --scope "$SCOPE" --fast "$FAST" --containers "$CONTAINERS"