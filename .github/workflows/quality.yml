name: Intern quality

# Runs on the repository's Windows self-hosted runner (labels self-hosted,
# Windows, X64). One machine, so jobs run one after another. The matrix, the
# verify-*.sh gates and the evidence allowlists are the ones .circleci/config.yml
# runs, bound to this commit's SHA; keep the two files in step while both exist.
#
# Manual-only (workflow_dispatch) until the whole matrix has passed on that
# runner: .circleci/config.yml stays the active CI and the merge gate. The
# runner prerequisites (Docker engine and account, antivirus) and the trigger
# switch are in docs/guide/quality.md, "CI execution environment".
#
# The Windows host is the Docker engine and the orchestrator, nothing more:
# - Bash steps run in Git Bash. The windows-runner action puts it on PATH (the
#   runner service has no usable bash and blocks PowerShell script files) and
#   installs the pinned jq the gates need.
# - Every Go step runs in a Linux container (.github/scripts/linux-go.sh): the
#   build, the race tests, the lint and the container acceptance harness itself.
#   The harness assumes a Linux host (container paths built with
#   filepath.Join, os.Getuid, bind mounts whose chown and chmod must hold), so it
#   cannot run as a Windows process. The container drives the host's engine
#   through its socket; require-linux-docker.sh insists the engine is a native
#   linux/amd64 one and runs before any toolchain or image work, so a runner
#   without a usable engine fails in seconds.
# - The gates, jq and the artifact upload stay on the host. Evidence that the
#   tests write inside the container comes back through linux-go.sh export.
# - The module proxy list starts with goproxy.cn: the runner's route to
#   proxy.golang.org was unreliable. go.sum and go.work.sum still pin every
#   module.
# - Container job limits are the CircleCI limits plus 15 minutes for cold image
#   pulls and module downloads on a runner that has not run the job before.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intern-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: .

env:
  GOTOOLCHAIN: local
  GOPROXY: https://goproxy.cn|https://proxy.golang.org,direct

jobs:
  scope:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    outputs:
      required: ${{ steps.scope.outputs.required }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/quality-scope.sh

  # The gate self-tests and the contract publication run on the host; the Go
  # build, race tests and lint run in the Linux container. The host steps come
  # first so a runner without a Docker engine still shows what it can verify
  # before the engine check fails the job.
  quality-fast:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45 # cold image pull and module cache on the first run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: W4 evidence gate accept and reject cases
        run: .github/scripts/w4-gate-cases.sh
      - name: P4 evidence gate accept and reject cases
        run: .github/scripts/p4-gate-cases.sh
      - name: W5 evidence gate accept and reject cases
        run: .github/scripts/w5-gate-cases.sh
      - name: D1 evidence gate accept and reject cases
        run: .github/scripts/d1-gate-cases.sh
      - name: S2 evidence gate accept and reject cases
        run: .github/scripts/s2-gate-cases.sh
      - name: Candidate artifact gate accept and reject cases
        run: .github/scripts/candidate-artifact-cases.sh
      - name: Publish the OpenAPI contract with its digest
        run: |
          set -euo pipefail
          mkdir -p .cache/contract
          cp app/web/api/openapi.yaml .cache/contract/openapi.yaml
          version=$(grep -m1 -E '^  version:' app/web/api/openapi.yaml | awk '{print $2}')
          test -n "$version"
          digest=$(sha256sum app/web/api/openapi.yaml | cut -d' ' -f1)
          printf 'source_sha=%s\ncontract=app/web/api/openapi.yaml\ninfo_version=%s\nsha256=%s\n' \
            "$GITHUB_SHA" "$version" "$digest" > .cache/contract/openapi.release
          cat .cache/contract/openapi.release
      - name: Retain the OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-openapi
          path: .cache/contract/
          if-no-files-found: error
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Build
        run: .github/scripts/linux-go.sh run 'go build ./internal/... ./app/cli/... ./app/web/...'
      - name: Behavior and race tests
        run: .github/scripts/linux-go.sh run 'go test -race -shuffle=on ./internal/... ./app/cli/... ./app/web/...'
      - name: Lint including integration code
        run: .github/scripts/linux-go.sh run 'bash .github/scripts/install-golangci-lint.sh && golangci-lint run --build-tags=integration ./internal/... ./app/cli/... ./app/web/...'
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-mysql:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      INTERN_TEST_PROFILE: ${{ matrix.profile }}
      INTERN_TEST_SOURCE_SHA: ${{ github.sha }}
      INTERN_TEST_PLATFORM: linux/amd64
      INTERN_CONTAINER_PARALLEL: '2'
      LINUX_GO_KEY: container-mysql-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Real CLI and database container scenarios
        run: |
          .github/scripts/linux-go.sh run --docker '
            export INTERN_TEST_REPORT_DIR="$HARNESS_DATA/report"
            mkdir -p "$INTERN_TEST_REPORT_DIR"
            go test -json -tags=integration -count=1 -shuffle=on -parallel=2 -timeout=35m ./app/cli/integration/... | tee "$INTERN_TEST_REPORT_DIR/events.jsonl"'
      - name: Reject incomplete or skipped scenario evidence
        if: always()
        run: |
          .github/scripts/linux-go.sh run '
            export INTERN_TEST_REPORT_DIR="$HARNESS_DATA/report"
            go run ./app/cli/cmd/quality-gate verify \
              --directory "$INTERN_TEST_REPORT_DIR" --profile "$INTERN_TEST_PROFILE" \
              --source "$INTERN_TEST_SOURCE_SHA" --platform "$INTERN_TEST_PLATFORM" --ci'
      - name: Bring the evidence back from the container
        if: always()
        run: .github/scripts/linux-go.sh export report ".cache/quality/${INTERN_TEST_PROFILE}"
      - name: Retain only approved diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Only the explicit evidence allowlist below.
          path: |
            .cache/quality/${{ matrix.profile }}/candidate.json
            .cache/quality/${{ matrix.profile }}/events.jsonl
            .cache/quality/${{ matrix.profile }}/receipts/*.json
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-physical:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native physical runner and source preflight
        run: |
          mkdir -p .cache/quality/physical
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=16m ./app/web/integration -run "^TestP2NativeContainers$"' | tee .cache/quality/physical/events.jsonl
      - name: Reject incomplete or skipped physical evidence
        if: always()
        run: .github/scripts/verify-physical-evidence.sh .cache/quality/physical/events.jsonl
      - name: Retain allowlisted physical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-p2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/physical/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-ftp:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native FTP publication and fault acceptance
        env:
          INTERN_S1_ARCH: amd64
        run: |
          mkdir -p .cache/quality/ftp
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=14m ./app/web/integration -run "^TestS1NativeContainers$"' | tee .cache/quality/ftp/events.jsonl
      - name: Reject incomplete or skipped FTP evidence
        if: always()
        run: .github/scripts/verify-ftp-evidence.sh .cache/quality/ftp/events.jsonl
      - name: Retain allowlisted FTP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftp-s1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/ftp/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-replication:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native replication, authentication and retention acceptance
        run: |
          mkdir -p .cache/quality/replication
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run "^TestR1NativeContainers$"' | tee .cache/quality/replication/events.jsonl
      - name: Reject incomplete or skipped replication evidence
        if: always()
        run: .github/scripts/verify-replication-evidence.sh .cache/quality/replication/events.jsonl
      - name: Retain allowlisted replication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replication-r1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/replication/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-web:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native Web resource, preflight and policy acceptance
        run: |
          mkdir -p .cache/quality/web
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=32m ./app/web/integration -run "^TestW3NativeContainers$"' | tee .cache/quality/web/events.jsonl
      - name: Reject incomplete or skipped Web evidence
        if: always()
        run: .github/scripts/verify-w3-evidence.sh .cache/quality/web/events.jsonl
      - name: Retain allowlisted Web evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-w3-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/web/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-dispatch:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native dispatcher run, replica and SSE acceptance
        run: |
          mkdir -p .cache/quality/dispatch
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=40m ./app/web/integration -run "^TestW4NativeContainers$"' | tee .cache/quality/dispatch/events.jsonl
      - name: Reject incomplete or skipped dispatcher evidence
        if: always()
        run: .github/scripts/verify-w4-evidence.sh .cache/quality/dispatch/events.jsonl
      - name: Retain allowlisted dispatcher evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-w4-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/dispatch/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-restore:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native isolated restore acceptance
        run: |
          mkdir -p .cache/quality/restore
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run "^TestP4NativeContainers$"' | tee .cache/quality/restore/events.jsonl
      - name: Reject incomplete or skipped restore evidence
        if: always()
        run: .github/scripts/verify-p4-evidence.sh .cache/quality/restore/events.jsonl
      - name: Retain allowlisted restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-p4-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/restore/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  container-restore-api:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native restore API end to end
        run: |
          mkdir -p .cache/quality/restore-api
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=50m ./app/web/integration -run "^TestW5NativeContainers$"' | tee .cache/quality/restore-api/events.jsonl
      - name: Reject incomplete or skipped restore API evidence
        if: always()
        run: .github/scripts/verify-w5-evidence.sh .cache/quality/restore-api/events.jsonl
      - name: Retain allowlisted restore API evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-api-w5-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/restore-api/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  # D1 deployment acceptance: the only job that builds the deployment image and
  # runs the repository Compose file with `docker compose`. The candidate-artifact
  # evidence (image id, `docker save` digest, component versions JSON) is captured
  # by the test inside the container and brought back here for the release gate to
  # bind. The test's fixture directories are bind-mounted into the containers it
  # starts and must keep their owners and modes, which is why it runs on the
  # engine's own filesystem (see linux-go.sh).
  container-deploy:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native Compose deployment acceptance
        run: |
          mkdir -p .cache/quality/deploy
          .github/scripts/linux-go.sh run --docker '
            export INTERN_D1_ARTIFACT_DIR="$HARNESS_DATA/deploy"
            mkdir -p "$INTERN_D1_ARTIFACT_DIR"
            go test -json -tags=integration -count=1 -timeout=55m ./app/web/integration -run "^TestD1NativeContainers$"' | tee .cache/quality/deploy/events.jsonl
      - name: Bring the candidate artifact record back from the container
        if: always()
        run: .github/scripts/linux-go.sh export deploy .cache/quality/deploy
      - name: Reject incomplete or skipped deployment evidence
        if: always()
        run: .github/scripts/verify-d1-evidence.sh .cache/quality/deploy/events.jsonl
      - name: Bind the candidate artifact to the run that wrote it
        if: always()
        run: .github/scripts/verify-candidate-artifact.sh .cache/quality/deploy/events.jsonl .cache/quality/deploy/candidate-artifact.json internal/physical/compat.json
      - name: Retain allowlisted deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-d1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            .cache/quality/deploy/events.jsonl
            .cache/quality/deploy/candidate-artifact.json
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  # S2 FTPS acceptance: the six-face TLS fixture, both FTPS modes, the four certificate
  # refusals with the server-side credential census, the chain replicated over FTPS and
  # the restores read back from that copy, with every published export started in a
  # brand-new pinned MySQL 8.4.11 container by the harness itself.
  container-ftps:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
      - name: Native Linux amd64 Docker engine
        run: .github/scripts/require-linux-docker.sh
      - name: Native FTPS container acceptance
        run: |
          mkdir -p .cache/quality/ftps
          .github/scripts/linux-go.sh run --docker 'go test -json -tags=integration -count=1 -timeout=80m ./app/web/integration -run "^TestS2NativeContainers$"' | tee .cache/quality/ftps/events.jsonl
      - name: Reject incomplete or skipped FTPS evidence
        if: always()
        run: .github/scripts/verify-s2-evidence.sh .cache/quality/ftps/events.jsonl
      - name: Retain allowlisted FTPS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftps-s2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/quality/ftps/events.jsonl
      - name: Remove the scratch tree
        if: always()
        run: .github/scripts/linux-go.sh clean

  quality-gate:
    name: quality-gate
    needs: [scope, quality-fast, container-mysql, container-physical, container-ftp, container-replication, container-web, container-dispatch, container-restore, container-restore-api, container-deploy, container-ftps]
    if: always()
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      # This job validates the upstream outcomes before it checks anything out,
      # so the repository's windows-runner action does not exist yet; put Git
      # Bash on PATH the way that action does.
      - name: Put Git Bash on PATH
        shell: cmd
        run: |
          for /f "delims=" %%G in ('where git') do set "GITEXE=%%G"
          for %%I in ("%GITEXE%\..\..") do set "GITROOT=%%~fI"
          >>"%GITHUB_PATH%" echo %GITROOT%\bin
      - name: Validate job outcomes and documentation-only scope
        env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
          PHYSICAL: ${{ needs.container-physical.result }}
          FTP: ${{ needs.container-ftp.result }}
          REPLICATION: ${{ needs.container-replication.result }}
          WEB: ${{ needs.container-web.result }}
          DISPATCH: ${{ needs.container-dispatch.result }}
          RESTORE: ${{ needs.container-restore.result }}
          RESTORE_API: ${{ needs.container-restore-api.result }}
          DEPLOY: ${{ needs.container-deploy.result }}
          FTPS: ${{ needs.container-ftps.result }}
        working-directory: .
        run: |
          test "$SCOPE" = success
          case "$REQUIRED" in
            true) test "$FAST" = success; test "$CONTAINERS" = success; test "$PHYSICAL" = success; test "$FTP" = success; test "$REPLICATION" = success; test "$WEB" = success; test "$DISPATCH" = success; test "$RESTORE" = success; test "$RESTORE_API" = success; test "$DEPLOY" = success; test "$FTPS" = success ;;
            false) test "$FAST" = skipped; test "$CONTAINERS" = skipped; test "$PHYSICAL" = skipped; test "$FTP" = skipped; test "$REPLICATION" = skipped; test "$WEB" = skipped; test "$DISPATCH" = skipped; test "$RESTORE" = skipped; test "$RESTORE_API" = skipped; test "$DEPLOY" = skipped; test "$FTPS" = skipped; echo 'quality-gate: not-required (documentation-only)' ;;
            *) echo 'quality-gate: invalid change classification' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.required == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-runner
        if: needs.scope.outputs.required == 'true'
      - name: Native Linux amd64 Docker engine
        if: needs.scope.outputs.required == 'true'
        run: .github/scripts/require-linux-docker.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.scope.outputs.required == 'true'
        with:
          pattern: container-*
          path: .cache/downloaded
      - name: Verify the entire locked matrix for this exact commit
        id: aggregate
        if: needs.scope.outputs.required == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ needs.scope.result }}
          FAST: ${{ needs.quality-fast.result }}
          CONTAINERS: ${{ needs.container-mysql.result }}
        run: |
          .github/scripts/linux-go.sh import downloaded .cache/downloaded
          .github/scripts/linux-go.sh run "go run ./app/cli/cmd/quality-gate aggregate --directory \"\$HARNESS_DATA/downloaded\" --source $SOURCE_SHA --platform linux/amd64 --required=true --scope $SCOPE --fast $FAST --containers $CONTAINERS"
      - name: Remove the scratch tree
        if: always() && steps.aggregate.conclusion != 'skipped'
        run: .github/scripts/linux-go.sh clean
