version: '3'

tasks:
  build:
    desc: Build the Intern CLI
    cmds:
      - go build -o bin/intern ./cli
  run:
    desc: Run CLI (task run -- --help)
    cmds:
      - go run ./cli {{.CLI_ARGS}}
  test:
    desc: Run shared and CLI regression tests
    cmds:
      - go test ./base/... ./cli/...
  lint:
    desc: Run the configured golangci-lint checks
    cmds:
      - golangci-lint run ./base/... ./cli/...
  fmt:
    desc: Format Go imports with the project configuration
    cmds:
      - golangci-lint fmt ./base/... ./cli/...
  check:
    desc: Build, test and lint business-code changes
    cmds:
      - go build ./base/... ./cli/...
      - go test -race ./base/... ./cli/...
      - golangci-lint run ./base/... ./cli/...
  generate:
    desc: Regenerate pinned sqlc SQLite bindings
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f base/sqlc.yaml