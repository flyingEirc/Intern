[tools]
go = "1.27.0"
golangci-lint = "2.13.2"

[env]
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build the Intern CLI into bin/intern"
run = "go build -o bin/intern ./app/cli"

[tasks.run]
description = "Run the CLI (mise run run --help)"
raw_args = true
run = '''
#!/usr/bin/env sh
exec go run ./app/cli "$@"
'''

[tasks.test]
description = "Run shared and CLI regression tests"
run = "go test ./internal/... ./app/cli/..."

[tasks."test:containers"]
description = "Run and verify every locked real-container profile"
raw_args = true
run = '''
#!/usr/bin/env sh
exec go run ./app/cli/cmd/quality-gate all "$@"
'''

[tasks."test:container"]
description = "Run and verify one real-container profile (default: mysql-9.7.1)"
raw_args = true
run = '''
#!/usr/bin/env sh
exec go run ./app/cli/cmd/quality-gate run --profile "${PROFILE:-mysql-9.7.1}" "$@"
'''

[tasks."lint:integration"]
description = "Lint production and integration code with the same rules"
run = "golangci-lint run --build-tags=integration ./internal/... ./app/cli/..."

[tasks.lint]
description = "Run the configured golangci-lint checks"
run = "golangci-lint run ./internal/... ./app/cli/..."

[tasks.fmt]
description = "Format Go imports with the project configuration"
run = "golangci-lint fmt ./internal/... ./app/cli/..."

[tasks.check]
description = "Build, test with race detection, then lint; stop on any failure"
run = [
    "go build ./internal/... ./app/cli/...",
    "go test -race ./internal/... ./app/cli/...",
    { task = "lint" },
]

[tasks.generate]
description = "Regenerate SQLite bindings with pinned sqlc v1.30.0"
run = "go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f internal/sqlc.yaml"
