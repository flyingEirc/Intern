          items:
            type: string
    PreflightResult:
      type: object
      additionalProperties: false
      required: [ok, checks, warnings]
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PreflightWarning'
        error:
          $ref: '#/components/schemas/PreflightFailure'
    ProbeResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: object
          additionalProperties: false
          required: [code, reply_code]
          properties:
            code:
              type: string
              minLength: 1
            reply_code:
              type: integer
              minimum: 0
    Policy:
      type: object
      additionalProperties: false
      required: [id, name, source_id, local_repository_id, replica_repository_id, full_cron, incremental_cron, timezone, max_chain_length, parallel, throttle, zstd_level, page_tracking, enabled, last_preflight, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        source_id:
          type: string
        local_repository_id:
          type: string
        replica_repository_id:
          type: string
          nullable: true
        full_cron:
          type: string
        incremental_cron:
          type: string
        timezone:
          type: string
          minLength: 1
        max_chain_length:
          type: integer
          minimum: 1
        parallel:
          type: integer
          minimum: 1
        throttle:
          type: integer
          minimum: 0
        zstd_level:
          type: integer
          minimum: 1
          maximum: 22
        page_tracking:
          type: boolean
        enabled:
          type: boolean
        last_preflight:
          allOf:
            - $ref: '#/components/schemas/PreflightRecord'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyWrite:
      type: object
      additionalProperties: false
      required: [name, source_id, local_repository_id, full_cron, incremental_cron, timezone, max_chain_length, parallel, throttle, zstd_level, page_tracking, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        source_id:
          type: string
        local_repository_id:
          type: string
        replica_repository_id:
          type: string
          nullable: true
        full_cron:
          type: string
          description: Standard 5-field cron expression, validated with cron.ParseStandard.
        incremental_cron:
          type: string
        timezone:
          type: string
          minLength: 1
          description: Non-empty IANA time zone name. The empty string and Local are rejected.
        max_chain_length:
          type: integer
          minimum: 1
        parallel:
          type: integer
          minimum: 1
        throttle:
          type: integer
          minimum: 0
        zstd_level:
          type: integer
          minimum: 1
          maximum: 22
        page_tracking:
          type: boolean
        enabled:
          type: boolean
    PolicyPage:
      type: object
      additionalProperties: false
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        next_before:
          type: string
          nullable: true
    RunTrigger:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/RunKind'
    RunKind:
      type: string
      enum: [full, incremental]
    RunStatus:
      type: string
      enum: [queued, running, completed, failed, canceled]
    RunTriggerKind:
      type: string
      enum: [cron, manual, admission]
    RunErrorClass:
      type: string
      description: The closed failure-class set of a failed run.
      enum: [unavailable, preflight, requires_full, canceled, interrupted, backup_failed, recovery_failed]
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id]
      properties:
        run_id:
          type: string
    Run:
      type: object
      additionalProperties: false
      required: [id, policy_id, source_id, kind, trigger, status, scheduled_at, created_at, started_at, finished_at, backup_id, chain_id, payload_size, error_class, error_code, cancel_requested, actor_id]
      properties:
        id:
          type: string
        policy_id:
          type: string
        source_id:
          type: string
        kind:
          $ref: '#/components/schemas/RunKind'
        trigger:
          $ref: '#/components/schemas/RunTriggerKind'
        status:
          $ref: '#/components/schemas/RunStatus'
        scheduled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        backup_id:
          type: string
          nullable: true
        chain_id:
          type: string
          nullable: true
        payload_size:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        error_class:
          allOf:
            - $ref: '#/components/schemas/RunErrorClass'
          nullable: true
        error_code:
          type: string
          nullable: true
        cancel_requested:
          type: boolean
        actor_id:
          type: string
          nullable: true
    RunPage:
      type: object
      additionalProperties: false
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_before:
          type: string
          nullable: true
    RunLog:
      type: object
      additionalProperties: false
      required: [run_id, seq, ts, level, event, message, data]
      properties:
        run_id:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        event:
          type: string
          minLength: 1
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Structured event payload. Null when the row has none.
    RunLogPage:
      type: object
      additionalProperties: false
      required: [items, next_after, truncated]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunLog'
        next_after:
          type: integer
          format: int64
          nullable: true
        truncated:
          type: boolean
          description: True when the log reached its cap and ends in the truncated marker.
    RunLogEvent:
      type: object
      description: >-
        The fixed wire shape of one streamed SSE event's data; it omits run_id
        because the stream already names the run. Event names come from the
        dispatcher lifecycle: queued, claimed, preflight_ok, preflight_failed,
        started, completed, failed, canceled, interrupted, replication_enqueued,
        replication_step; the per-run log cap adds one final truncated marker.
        Heartbeats are ": ping" comments and the stream ends with an end event
        carrying the terminal status. data is the structured payload for that
        event and contains no secrets.
      additionalProperties: false
      required: [seq, ts, level, event, message, data]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        event:
          type: string
          minLength: 1
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Structured event payload. Null when the row has none.
    ReplicaStatus:
      type: string
      enum: [pending, uploading, uploaded, verified, failed, exhausted]
    Replica:
      type: object
      additionalProperties: false
      required: [backup_id, repository_id, status, attempts, next_attempt_at, uploaded_at, verified_at, alert_since, last_error_code, last_reply_code]
      properties:
        backup_id:
          type: string
        repository_id:
          type: string
        status:
          $ref: '#/components/schemas/ReplicaStatus'
        attempts:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        uploaded_at:
          type: string
          format: date-time
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        alert_since:
          type: string
          format: date-time
          nullable: true
        last_error_code:
          type: string
        last_reply_code:
          type: integer
    ReplicaPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Replica'
    Backup:
      type: object
      additionalProperties: false
      required: [id, chain_id, parent_id, kind, status, seq, from_lsn, to_lsn, last_lsn, object_path, payload_size, payload_sha256, local_present, completed_at, replicas]
      properties:
        id:
          type: string
        chain_id:
          type: string
        parent_id:
          type: string
        kind:
          type: string
          enum: [physical-full, physical-incremental]
        status:
          type: string
          enum: [running, completed, failed]
        seq:
          type: integer
          minimum: 1
        from_lsn:
          type: string
          description: Decimal text of the unsigned 64-bit LSN; empty when unset.
        to_lsn:
          type: string
        last_lsn:
          type: string
        object_path:
          type: string
        payload_size:
          type: integer
          format: int64
          minimum: 0
        payload_sha256:
          type: string
        local_present:
          type: boolean
        completed_at:
          type: string
          format: date-time
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/Replica'
    Chain:
      type: object
      additionalProperties: false
      required: [id, source_id, server_uuid, started_at, sealed_at, pinned, members]
      properties:
        id:
          type: string
        source_id:
          type: string
        server_uuid:
          type: string
        started_at:
          type: string
          format: date-time
        sealed_at:
          type: string
          format: date-time
        pinned:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
    ChainPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chain'
    Point:
      type: object
      additionalProperties: false
      required: [backup_id, chain_id, at]
      properties:
        repository_id:
          type: string
        backup_id:
          type: string
        chain_id:
          type: string
        at:
          type: string
          format: date-time
    Protection:
      type: object
      additionalProperties: false
      required: [local, remote]
      properties:
        local:
          allOf:
            - $ref: '#/components/schemas/Point'
          nullable: true
        remote:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        preflight:
          $ref: '#/components/schemas/PreflightResult'
        code:
          type: string
          enum: [bad_request, invalid_json, unsupported_media_type, payload_too_large, not_found, method_not_allowed, internal, unavailable, unauthorized, forbidden, cross_origin_rejected, rate_limited, conflict, validation_failed, preflight_failed]
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
