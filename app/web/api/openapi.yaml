openapi: 3.0.3
info:
  title: Intern Web control plane
  version: 0.3.0
  description: >-
    Session authentication, three-role authorization, users and audit API.
    JSON uses encoding/json/v2; handwritten handlers are checked by kin-openapi.
    HTTPS is required for the Secure intern_session cookie; no insecure-cookie option exists.
    Session defaults are 30 minutes idle and 12 hours absolute, configured by
    session.idle_timeout and session.lifetime (positive, idle <= lifetime).
    Login limits are 30 attempts/minute/IP (burst 30) and 5 attempts/minute/IP +
    case-folded username (burst 5), with at most 10000 combined LRU buckets.
    Only usernames matching Username are distinct limiter keys; every other
    username shares one fixed key per IP and is not stored. The per-user bucket
    is not created when the IP bucket already denies the attempt.
    Current-password checks on PUT /api/v1/auth/password are limited to 5
    attempts/minute/user (burst 5). At most 2 argon2id operations run at once
    per process, not machine-wide. Anonymous login verification holds at most
    1 of those slots; authenticated password and user-administration hashes use
    the remaining capacity. A full cap returns 503 unavailable immediately with
    Retry-After and does not queue. API responses are buffered up to 8 MiB; a
    larger or streaming body becomes one 500 and does not commit a session.
    Stage C adds the persistent run queue: manual triggers behind an
    Idempotency-Key, run lists and bounded logs with cursor pagination, run
    cancellation, chains, backups, the split local/remote protection view and
    the replica queue. GET /api/v1/runs/{id}/events streams the run lifecycle
    as text/event-stream over an unbuffered, authenticated channel: replay from
    Last-Event-ID or after_seq, heartbeats every 15s, one final end event at the
    terminal status, and a revoked event when the session stops being valid.
    zstd_level is stored per policy but the encoder is fixed at concurrency 1
    and the level is not applied.
    Stage D adds isolated restores: a read-only plan endpoint behind
    restores:plan, an execute endpoint behind restores:execute that requires
    the administrator's password re-entry and a matching plan digest, bounded
    restore logs, and cancellation. Restores and backup runs share one global
    execution slot: neither queue is claimed while the other has a running row.
    A restore publishes its export by an atomic non-overwriting rename; a
    published export is never deleted by a cancel or by restart recovery.
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      summary: Check process liveness independently of the metadata database
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: The process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: readiness
      security: []
      summary: Check database connectivity and the exact expected migration version
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Metadata is ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '413':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      summary: Authenticate and renew the session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user; a fresh server-side session is issued
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              required: true
              description: intern_session with Secure, HttpOnly, SameSite=Lax, Path=/
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RetryableError'
        '503':
          $ref: '#/components/responses/RetryableError'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Destroy the current server-side session
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/session:
    get:
      operationId: currentSession
      summary: Read the current database user and effective permissions
      responses:
        '200':
          description: Current session
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/password:
    put:
      operationId: changeOwnPassword
      summary: Change own password and revoke other sessions
      description: >-
        Current-password verification is limited to 5 attempts per minute per user
        (burst 5). It uses the authenticated portion of the per-process argon2id
        cap of 2, so anonymous login cannot hold every slot.
        A 204 means the password change and its success audit committed. When
        token rotation succeeds, this session continues on a new token and every
        other session is revoked. If the password transaction succeeds but token
        rotation fails, the response is still 204: the password change succeeded,
        the previous session is no longer valid, and the client must log in again
        with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  $ref: '#/components/schemas/Password'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RetryableError'
        '503':
          $ref: '#/components/responses/RetryableError'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users (users:manage, admin only)
      responses:
        '200':
          description: Users ordered by case-insensitive username
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUser
      summary: Create a user (users:manage, admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, role]
              properties:
                username:
                  $ref: '#/components/schemas/Username'
                password:
                  $ref: '#/components/schemas/Password'
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RetryableError'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getUser
      summary: Read a user (users:manage, admin only)
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateUser
      summary: Update a user and revoke their sessions (users:manage, admin only)
      description: The last enabled administrator cannot be disabled or demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                role:
                  $ref: '#/components/schemas/Role'
                disabled:
                  type: boolean
                password:
                  $ref: '#/components/schemas/Password'
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RetryableError'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserID'
    delete:
      operationId: revokeUserSessions
      summary: Revoke all sessions for a user (users:manage, admin only)
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      summary: Read audit history (audit:read, admin only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: before
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Descending ID order; next_before is null at the end
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_before]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  next_before:
                    type: integer
                    format: int64
                    nullable: true
                    minimum: 1
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories:
    get:
      operationId: listRepositories
      summary: List backup repositories (resources:read)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Descending UUIDv7 ID order; next_before is null at the end
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createRepository
      summary: Create a local, plain-FTP or FTPS repository (repositories:manage, admin only)
      description: >-
        A local repository requires tls_mode "none" and an absolute root. An FTP
        repository must name its own transport: "plain", "explicit" or "implicit";
        an omitted or unknown value is 422 and is never guessed from the address or
        port. An FTPS repository may carry ca_pem, the public PEM bundle that signed
        the server certificate, and without it the system roots are used. No option
        skips certificate verification, and a bundle that is unparsable, oversized,
        or sent with tls_mode "plain" is 422. The password is sealed with the
        deployment KEK and is never returned. A successful plain FTP create records
        plaintext_ftp=true in the same transaction as its audit; an FTPS create
        records no such flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryWrite'
      responses:
        '201':
          $ref: '#/components/responses/Repository'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRepository
      summary: Read one repository (resources:read)
      responses:
        '200':
          $ref: '#/components/responses/Repository'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateRepository
      summary: Replace a repository (repositories:manage, admin only)
      description: >-
        kind and tls_mode are immutable: a repository never changes transport, so
        an FTPS copy cannot be moved to plaintext and a plaintext one cannot acquire
        a CA bundle by update. An omitted password keeps the stored secret; a
        supplied password replaces the ciphertext in place, in the same transaction
        as the success audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryWrite'
      responses:
        '200':
          $ref: '#/components/responses/Repository'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteRepository
      summary: Delete a repository (repositories:manage, admin only)
      description: A repository used by a policy or a replica row cannot be deleted.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories/{id}/probe:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: probeRepository
      summary: Probe repository writability (repositories:manage, admin only)
      description: >-
        A local repository is probed through a private staged write and removal.
        An FTP repository is opened with this instance's namespace marker over the
        transport its tls_mode names, and probed without publishing. An FTPS probe
        that cannot verify the server answers ok=false with a tls_ code (tls_untrusted,
        tls_hostname, tls_expired, tls_negotiation) and never transmits the
        credential. The result is 200 with ok=false and a safe code when the target
        is unusable; raw replies, paths and credentials never appear.
      responses:
        '200':
          description: Probe result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sources:
    get:
      operationId: listSources
      summary: List MySQL sources (resources:read)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Descending UUIDv7 ID order; next_before is null at the end
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSource
      summary: Create a MySQL source (sources:manage, admin or operator)
      description: The password is sealed with the deployment KEK and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceWrite'
      responses:
        '201':
          $ref: '#/components/responses/Source'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getSource
      summary: Read one source (resources:read)
      responses:
        '200':
          $ref: '#/components/responses/Source'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSource
      summary: Replace a source (sources:manage, admin or operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceWrite'
      responses:
        '200':
          $ref: '#/components/responses/Source'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSource
      summary: Delete a source (sources:manage, admin or operator)
      description: A source used by a policy or by any physical chain cannot be deleted.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sources/{id}/preflight:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: preflightSource
      summary: Run the real source preflight (sources:manage, admin or operator)
      description: >-
        Runs the mounted-socket MySQL preflight with the local repository as the
        backup root, bounded by a 60-second deadline. Success persists the observed
        identity and record; failure returns 200 with ok=false and a structured
        error. Neither the password, the DSN nor raw tool output appears.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [local_repository_id]
              properties:
                local_repository_id:
                  type: string
      responses:
        '200':
          description: Preflight outcome
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies:
    get:
      operationId: listPolicies
      summary: List backup policies (resources:read)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Descending UUIDv7 ID order; next_before is null at the end
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPolicy
      summary: Create a backup policy (policies:manage, admin or operator)
      description: >-
        enabled=true runs the source preflight and, when a replica is configured,
        the replica probe first. A failed preflight returns 409 preflight_failed
        with the structured outcome and writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyWrite'
      responses:
        '201':
          $ref: '#/components/responses/Policy'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/PreflightErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getPolicy
      summary: Read one policy (resources:read)
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updatePolicy
      summary: Replace a policy (policies:manage, admin or operator)
      description: >-
        enabled=true re-runs the preflight. A failed preflight returns 409
        preflight_failed and leaves the stored row unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyWrite'
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/PreflightErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePolicy
      summary: Delete a policy (policies:manage, admin or operator)
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: enablePolicy
      summary: Enable a policy after a real preflight (policies:manage, admin or operator)
      description: >-
        Runs the source preflight and the replica probe. Only on success does one
        transaction set enabled=1, persist the preflight record and write the
        success audit. On failure the response is 409 preflight_failed with the
        structured outcome, enabled stays 0, and the failure audit is best-effort.
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/PreflightErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: disablePolicy
      summary: Disable a policy (policies:manage, admin or operator)
      description: Disable is always allowed and needs no preflight.
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: triggerPolicyRun
      summary: Create one manual run (runs:trigger, admin or operator)
      description: >-
        Body {kind: full|incremental}. The Idempotency-Key header of 1 to 128
        characters is required. The same key with the same canonical body
        replays 202 with the same run_id; the same key with a different body or
        a disabled policy answers 409 conflict. A deployment without the KEK,
        work root or XtraBackup executable answers 503 unavailable immediately
        and records nothing. A created run stays queued until the single backup
        worker claims it; the status then follows
        queued -> running -> completed | failed | canceled with no finalizing
        state, because the physical success commit is an interior step of the
        chain run. The accepted body is {run_id}.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique manual trigger key of 1 to 128 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTrigger'
      responses:
        '202':
          description: Run created or replayed with the same idempotency key
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/runs:
    get:
      operationId: listRuns
      summary: List runs newest first (runs:read, viewer and above)
      description: >-
        Descending UUIDv7 id order with the shared cursor contract. Filters are
        exact matches; status must be one of queued, running, completed, failed
        or canceled.
      parameters:
        - name: policy_id
          in: query
          description: Exact policy id match; must be a resource id.
          schema:
            type: string
        - name: source_id
          in: query
          description: Exact source id match; must be a resource id.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RunStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Descending UUIDv7 ID order; next_before is null at the end
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRun
      summary: Read one run (runs:read, viewer and above)
      responses:
        '200':
          description: One run row; idempotency_key and request_hash are never exposed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/runs/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listRunLogs
      summary: Read one run's bounded event log (runs:read, viewer and above)
      description: >-
        Ascending seq order with at most 1000 rows per run. When the cap was
        reached, the final row is the truncated marker and the response sets
        truncated=true. after_seq returns rows with a greater sequence only.
      parameters:
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Ascending seq order; next_after is the last returned seq
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLogPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/runs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: cancelRun
      summary: Request run cancellation (runs:cancel, admin or operator)
      description: >-
        A queued run becomes canceled without running. A running run's context
        is canceled; the success point wins, so a run whose physical chain
        completed stays completed and a cancel never deletes a backup. A
        terminal run answers 409 conflict. The accepted body is {run_id}.
      responses:
        '202':
          description: Cancel request recorded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/runs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: streamRunEvents
      summary: Stream one run's lifecycle as SSE (runs:read, viewer and above)
      description: >-
        text/event-stream over an unbuffered channel. Authentication, the
        user/disabled/epoch checks and runs:read all run before the first byte;
        failures are ordinary JSON 401/403/404/400. After the first byte errors
        only close the stream and no JSON is mixed in. Replay is every run_logs
        row with seq greater than Last-Event-ID (or the after_seq query
        parameter), then live events, then one final end event whose data is
        the terminal status. Each event's id is its run_logs.seq and heartbeats
        are ": ping" comments every 15s; every heartbeat rechecks the session
        and permission, and a mismatch emits one revoked event and closes. The
        per-subscriber buffer holds 256 events; an overflow drops the
        subscriber without touching the run.

        replication_enqueued and replication_step are appended after the
        terminal event, because the replication handoff runs once the backup is
        committed. They are therefore not delivered to a live stream that has
        already ended; they appear on replay (a later subscription, or
        Last-Event-ID/after_seq) and in the logs API. A client that needs the
        replication outcome reads GET /api/v1/runs/{id}/logs once the run is
        terminal, or polls the replicas API.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Replay only rows with a greater seq; takes precedence over after_seq.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: The event stream itself; each event matches RunLogEvent
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: Always no-cache.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunLogEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sources/{id}/chains:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listSourceChains
      summary: List one source's chains with their members (resources:read)
      responses:
        '200':
          description: Chains oldest first; members carry kind, seq, status, presence, LSNs and payload identity
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/backups/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getBackup
      summary: Read one backup with its per-repository replicas (resources:read)
      responses:
        '200':
          description: One backup row with the replica rows of every repository
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sources/{id}/protection:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getSourceProtection
      summary: Read the split local and remote protection points (resources:read)
      description: >-
        local is the latest locally completed backup whose chain prefix is all
        completed. remote holds one point per replica repository, taken from the
        union of that source's replicas on the repository across every
        (local, replica) pair: the union is ordered by chain position. A present
        but unverified row ends the scan. A seq gap drops only the chain it
        falls in: the rest of that chain is skipped, including its
        present-but-unverified rows, and the scan continues with the next
        chain. The point is therefore the latest member of the last chain that
        is fully verified, present from seq 1 with no gap, and reached before
        any unverified row of a chain no gap had dropped. Only verified
        replicas advance it, uploaded is never treated as verified, and proof
        times are never compared. Either side is null when no such point exists.
      responses:
        '200':
          description: The local point and the per-repository remote points
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/replicas:
    get:
      operationId: listReplicas
      summary: List replica queue rows (resources:read)
      description: >-
        Bounded FIFO view over the per-repository replication queues. Filters
        are exact matches; status is one of pending, uploading, uploaded,
        verified, failed or exhausted.
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
        - name: repository_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReplicaStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Replica rows in FIFO order per repository
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/backups/{id}/replicas/{repository_id}/retry:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: retryReplica
      summary: Reset one replica for an immediate attempt (replicas:retry, admin or operator)
      description: >-
        Resets the replica row to pending with zeroed attempts and kicks the
        replication worker so the copy starts without waiting for the next
        poll. The accepted body is {run_id} carrying the backup id.
      responses:
        '202':
          description: Retry scheduled; the body carries the backup id
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/restores/plan:
    post:
      operationId: planRestore
      summary: Build a fresh restore plan (restores:plan, admin or operator)
      description: >-
        Read-only: no restore row, no file and no FTP write. The plan names the
        target backup, every chain link with its source (local or ftp), the
        payload and metadata sizes, the target LSN, the space estimate against
        the work and export volumes, the planned export path, fixed risk codes,
        the sha256 plan digest the execute request must confirm, and whether a
        rehearsal can run. A refusal is restore_refused with the engine's fixed
        machine code in error.detail.code: 404 backup_not_found, 422
        matrix_unsupported, 409 for every other refusal, 503 when the restore
        runtime is not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestorePlanRequest'
      responses:
        '200':
          description: Fresh plan; plan_digest is the confirmed digest input
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestorePlan'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/restores:
    get:
      operationId: listRestores
      summary: List restores newest first (restores:read, viewer and above)
      description: >-
        Descending UUIDv7 id order with the shared cursor contract. Filters are
        exact matches; status is one of queued, running, completed, failed or
        canceled.
      parameters:
        - name: backup_id
          in: query
          description: Exact backup id match; must be a resource id.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RestoreStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Descending UUIDv7 ID order; next_before is null at the end
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestorePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: executeRestore
      summary: Execute a confirmed restore plan (restores:execute, admin only)
      description: >-
        Requires the administrator's password re-entry; a wrong password is 403
        confirmation_failed with a denied audit row and no restore row. Password
        confirmation is limited to 5 attempts/minute/user (429 with
        Retry-After), on the same per-user budget PUT /auth/password spends: the
        two routes share one limiter, so a session gets five guesses in total,
        not five each. plan_digest must equal a fresh plan built at request time,
        otherwise 409 plan_changed. rehearse=true without a configured mysqld is
        422 validation_failed. verify_sql is admitted by the restore engine's own
        validator and bounds, then executed in a read-only transaction by the
        rehearsal and never written to the audit. The queued restore row and its
        success audit commit in one transaction; an audit failure rolls the row
        back and answers 500. An optional Idempotency-Key replays the stored
        restore for the same request; the same key with a different request is
        409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreExecuteRequest'
      responses:
        '202':
          description: Restore queued, or replayed for the same idempotency key
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RetryableError'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/restores/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRestore
      summary: Read one restore (restores:read, viewer and above)
      description: >-
        Returns the confirmed plan with every chain link and its source, phase,
        export_path/export_bytes, verify_status/verify_result,
        error_class/error_code and the exact side effects recovery observed.
        idempotency_key and request_hash are never exposed.
      responses:
        '200':
          description: One restore row
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restore'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/restores/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listRestoreLogs
      summary: Read one restore's bounded event log (restores:read, viewer and above)
      description: >-
        Ascending seq order with at most 1000 rows per restore. When the cap was
        reached, the final row is the truncated marker and the response sets
        truncated=true. after_seq returns rows with a greater sequence only.
      parameters:
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Ascending seq order; next_after is the last returned seq
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreLogPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/restores/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: cancelRestore
      summary: Request restore cancellation (restores:execute, admin only)
      description: >-
        A queued restore becomes canceled without running. A running restore's
        context is canceled; the published export wins, so a restore whose
        export was already renamed into place stays completed and no cancel or
        recovery ever deletes a published export. A terminal restore answers 409
        conflict. The accepted body is {restore_id}.
      responses:
        '202':
          description: Cancel request recorded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: intern_session
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Before:
      name: before
      in: query
      description: Return only rows whose ID sorts before this one.
      schema:
        type: string
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: >-
        A nonempty value of at most 64 ASCII letters, digits, dots, underscores, or
        hyphens is echoed. Other values are replaced with a generated UUIDv7.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional 1 to 128 character key. The same key and request replay the
        stored restore; the same key with a different request is 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RequestID:
      description: Accepted incoming request ID or a generated UUIDv7
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
  responses:
    NoContent:
      description: Operation completed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    User:
      description: User without password hash or session epoch
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Repository:
      description: Repository without its sealed secret
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Repository'
    Source:
      description: Source without its sealed password
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Source'
    Policy:
      description: Policy
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Policy'
    PreflightErrorResponse:
      description: >-
        preflight_failed (409) with the structured preflight outcome in
        error.preflight. validation_failed and conflict are also possible here.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RetryableError:
      description: >-
        rate_limited (429) or unavailable (503). Retry-After is whole seconds.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      description: >-
        Unified error; covers invalid_json (400), validation_failed (400),
        unauthorized (401), forbidden and cross_origin_rejected (403), not_found
        (404), method_not_allowed (405), conflict (409), payload_too_large (413),
        unsupported_media_type (415), rate_limited (429), internal (500), and
        unavailable (503), as applicable. Wrong current password is 400, not 401.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
    Username:
      type: string
      pattern: '^[A-Za-z0-9._-]{3,64}$'
    Password:
      type: string
      writeOnly: true
      minLength: 12
      maxLength: 256
      description: 12–256 Unicode characters; never returned or logged
    Role:
      type: string
      enum: [admin, operator, viewer]
    Permission:
      type: string
      enum: ['session:self', 'users:manage', 'audit:read', 'repositories:manage', 'sources:manage', 'policies:manage', 'resources:read', 'runs:read', 'runs:trigger', 'runs:cancel', 'replicas:retry', 'restores:read', 'restores:plan', 'restores:execute']
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, disabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        role:
          $ref: '#/components/schemas/Role'
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, ts, actor_type, actor_id, actor_name, action, resource_type, resource_id, ip, result, status, request_id, detail]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        ts:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, system, anonymous]
        actor_id:
          type: string
        actor_name:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        ip:
          type: string
        result:
          type: string
          enum: [success, denied, failed]
        status:
          type: integer
          nullable: true
          minimum: 100
          maximum: 599
        request_id:
          type: string
        detail:
          type: object
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/Role'
            disabled:
              type: boolean
            password_changed:
              type: boolean
            method:
              type: string
              enum: [POST, PUT, PATCH, DELETE]
            route:
              type: string
            plaintext_ftp:
              type: boolean
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    RepositoryKind:
      type: string
      enum: [local, ftp]
    TLSMode:
      type: string
      enum: [none, plain, explicit, implicit]
      description: >-
        The transport a repository uses, chosen once at creation. local is "none".
        ftp is "plain" (cleartext FTP, credentials included), "explicit" (FTPS after
        AUTH TLS) or "implicit" (FTPS on a TLS-only listener). An FTPS session needs
        TLS 1.2 or newer on both channels and verifies the server against ca_pem or,
        when none is supplied, the system roots; no mode skips that verification and
        none falls back to plaintext.
    Repository:
      type: object
      additionalProperties: false
      required: [id, name, kind, tls_mode, has_secret, plaintext_credentials, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: '#/components/schemas/RepositoryKind'
        tls_mode:
          $ref: '#/components/schemas/TLSMode'
        local:
          type: object
          additionalProperties: false
          required: [root]
          properties:
            root:
              type: string
        ftp:
          type: object
          additionalProperties: false
          required: [host, port, base_path, username]
          properties:
            host:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            base_path:
              type: string
            username:
              type: string
            ca_pem:
              type: string
              description: >-
                The public PEM bundle that signed this FTPS server's certificate,
                empty when the system roots are trusted. Never returned for plain.
        has_secret:
          type: boolean
          description: A sealed secret is stored; the value is never returned.
        plaintext_credentials:
          type: boolean
          description: >-
            True only for plain FTP, whose credentials cross the network
            unencrypted. An explicit or implicit FTPS repository is always false.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RepositoryWrite:
      type: object
      additionalProperties: false
      required: [name, kind, tls_mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: '#/components/schemas/RepositoryKind'
        tls_mode:
          allOf:
            - $ref: '#/components/schemas/TLSMode'
          description: >-
            Must match the kind: "none" for local, and one of "plain", "explicit"
            or "implicit" for an FTP repository. An FTP repository that omits it is
            422; the mode is immutable afterwards.
        root:
          type: string
          description: Required for local repositories; must be an absolute path.
        ftp:
          type: object
          additionalProperties: false
          required: [host, port, base_path, username]
          properties:
            host:
              type: string
              minLength: 1
            port:
              type: integer
              minimum: 1
              maximum: 65535
            base_path:
              type: string
              pattern: '^(/[^/]+)*$'
            username:
              type: string
              minLength: 1
            ca_pem:
              type: string
              maxLength: 262144
              description: >-
                Optional FTPS trust bundle: one or more certificate PEM blocks. A
                bundle that does not parse, exceeds the limit, or is sent with
                tls_mode "plain" is 422. It is public data, not a secret, and is
                stored with the repository configuration.
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: >-
            Required when creating an FTP repository. On update, omitted keeps the
            stored secret and supplied replaces it in place.
    RepositoryPage:
      type: object
      additionalProperties: false
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
        next_before:
          type: string
          nullable: true
    Source:
      type: object
      additionalProperties: false
      required: [id, name, socket, datadir, username, has_secret, server_uuid, server_version, last_preflight, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        socket:
          type: string
        datadir:
          type: string
        username:
          type: string
        has_secret:
          type: boolean
        server_uuid:
          type: string
          nullable: true
        server_version:
          type: string
          nullable: true
        last_preflight:
          allOf:
            - $ref: '#/components/schemas/PreflightRecord'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SourceWrite:
      type: object
      additionalProperties: false
      required: [name, socket, datadir, username]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        socket:
          type: string
          minLength: 1
        datadir:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Required when creating; omitted on update keeps the stored secret.
    SourcePage:
      type: object
      additionalProperties: false
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        next_before:
          type: string
          nullable: true
    PreflightWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    PreflightRecord:
      type: object
      additionalProperties: false
      required: [ok, checks, warnings]
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PreflightWarning'
    PreflightFailure:
      type: object
      additionalProperties: false
      required: [check, code, message]
      properties:
        check:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        missing:
          type: array
          items:
            type: string
    PreflightResult:
      type: object
      additionalProperties: false
      required: [ok, checks, warnings]
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PreflightWarning'
        error:
          $ref: '#/components/schemas/PreflightFailure'
    ProbeResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: object
          additionalProperties: false
          required: [code, reply_code]
          properties:
            code:
              type: string
              minLength: 1
            reply_code:
              type: integer
              minimum: 0
    Policy:
      type: object
      additionalProperties: false
      required: [id, name, source_id, local_repository_id, replica_repository_id, full_cron, incremental_cron, timezone, max_chain_length, parallel, throttle, zstd_level, page_tracking, enabled, last_preflight, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        source_id:
          type: string
        local_repository_id:
          type: string
        replica_repository_id:
          type: string
          nullable: true
        full_cron:
          type: string
        incremental_cron:
          type: string
        timezone:
          type: string
          minLength: 1
        max_chain_length:
          type: integer
          minimum: 1
        parallel:
          type: integer
          minimum: 1
        throttle:
          type: integer
          minimum: 0
        zstd_level:
          type: integer
          minimum: 1
          maximum: 22
        page_tracking:
          type: boolean
        enabled:
          type: boolean
        last_preflight:
          allOf:
            - $ref: '#/components/schemas/PreflightRecord'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyWrite:
      type: object
      additionalProperties: false
      required: [name, source_id, local_repository_id, full_cron, incremental_cron, timezone, max_chain_length, parallel, throttle, zstd_level, page_tracking, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        source_id:
          type: string
        local_repository_id:
          type: string
        replica_repository_id:
          type: string
          nullable: true
        full_cron:
          type: string
          description: Standard 5-field cron expression, validated with cron.ParseStandard.
        incremental_cron:
          type: string
        timezone:
          type: string
          minLength: 1
          description: Non-empty IANA time zone name. The empty string and Local are rejected.
        max_chain_length:
          type: integer
          minimum: 1
        parallel:
          type: integer
          minimum: 1
        throttle:
          type: integer
          minimum: 0
        zstd_level:
          type: integer
          minimum: 1
          maximum: 22
        page_tracking:
          type: boolean
        enabled:
          type: boolean
    PolicyPage:
      type: object
      additionalProperties: false
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        next_before:
          type: string
          nullable: true
    RunTrigger:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/RunKind'
    RunKind:
      type: string
      enum: [full, incremental]
    RunStatus:
      type: string
      enum: [queued, running, completed, failed, canceled]
    RunTriggerKind:
      type: string
      enum: [cron, manual, admission]
    RunErrorClass:
      type: string
      description: The closed failure-class set of a failed run.
      enum: [unavailable, preflight, requires_full, canceled, interrupted, backup_failed, recovery_failed]
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id]
      properties:
        run_id:
          type: string
    Run:
      type: object
      additionalProperties: false
      required: [id, policy_id, source_id, kind, trigger, status, scheduled_at, created_at, started_at, finished_at, backup_id, chain_id, payload_size, error_class, error_code, cancel_requested, actor_id]
      properties:
        id:
          type: string
        policy_id:
          type: string
        source_id:
          type: string
        kind:
          $ref: '#/components/schemas/RunKind'
        trigger:
          $ref: '#/components/schemas/RunTriggerKind'
        status:
          $ref: '#/components/schemas/RunStatus'
        scheduled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        backup_id:
          type: string
          nullable: true
        chain_id:
          type: string
          nullable: true
        payload_size:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        error_class:
          allOf:
            - $ref: '#/components/schemas/RunErrorClass'
          nullable: true
        error_code:
          type: string
          nullable: true
        cancel_requested:
          type: boolean
        actor_id:
          type: string
          nullable: true
    RunPage:
      type: object
      additionalProperties: false
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_before:
          type: string
          nullable: true
    RunLog:
      type: object
      additionalProperties: false
      required: [run_id, seq, ts, level, event, message, data]
      properties:
        run_id:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        event:
          type: string
          minLength: 1
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Structured event payload. Null when the row has none.
    RunLogPage:
      type: object
      additionalProperties: false
      required: [items, next_after, truncated]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunLog'
        next_after:
          type: integer
          format: int64
          nullable: true
        truncated:
          type: boolean
          description: True when the log reached its cap and ends in the truncated marker.
    RestoreStatus:
      type: string
      enum: [queued, running, completed, failed, canceled]
    RestorePhase:
      type: string
      description: >-
        The live engine phase of a running restore. Every terminal write nulls
        it, so a queued, completed, failed or canceled row reports null; the
        sequence the engine really recorded is in the restore log
        (GET /api/v1/restores/{id}/logs).
      enum: [fetching, authenticating, extracting, preparing, exporting, rehearsing]
    RestoreErrorClass:
      type: string
      description: The closed failure-class set of a failed or canceled restore.
      enum: [unavailable, refused, restore_failed, canceled, interrupted]
    RestoreVerifyStatus:
      type: string
      description: >-
        Rehearsal outcome, separate from the restore status. not_requested when
        no rehearsal was asked for; pending from the moment a row that asked for
        one is queued until the row finishes; passed or failed once the rehearsal
        ran (a failed rehearsal never fails a published restore); not_run when a
        rehearsal was asked for but the restore failed, was canceled or was
        interrupted before the rehearsal produced a result.
      enum: [not_requested, pending, passed, failed, not_run]
    RestoreSideEffects:
      type: object
      additionalProperties: false
      required: [work_dir_removed, pending_export_removed, export_published]
      properties:
        work_dir_removed:
          type: boolean
        pending_export_removed:
          type: boolean
        export_published:
          type: boolean
    RestorePlanLink:
      type: object
      additionalProperties: false
      required: [backup_id, seq, kind, from_lsn, to_lsn, source, repository_id, payload_size, metadata_size]
      properties:
        backup_id:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: '#/components/schemas/RunKind'
        from_lsn:
          type: integer
          minimum: 0
        to_lsn:
          type: integer
          minimum: 0
        source:
          type: string
          enum: [local, ftp]
        repository_id:
          type: string
        payload_size:
          type: integer
          format: int64
          minimum: 0
        metadata_size:
          type: integer
          format: int64
          minimum: 0
    RestorePlan:
      type: object
      additionalProperties: false
      required:
        [backup_id, chain_id, source_id, server_uuid, server_version, tool_version,
         target_to_lsn, links, required_work_bytes, required_export_bytes,
         available_work_bytes, available_export_bytes, export_path, risks,
         plan_digest, rehearsal_available]
      properties:
        backup_id:
          type: string
        chain_id:
          type: string
        source_id:
          type: string
        server_uuid:
          type: string
        server_version:
          type: string
        tool_version:
          type: string
        target_to_lsn:
          type: integer
          minimum: 0
        links:
          type: array
          items:
            $ref: '#/components/schemas/RestorePlanLink'
        required_work_bytes:
          type: integer
          format: int64
          minimum: 0
        required_export_bytes:
          type: integer
          format: int64
          minimum: 0
        available_work_bytes:
          type: integer
          format: int64
          minimum: 0
        available_export_bytes:
          type: integer
          format: int64
          minimum: 0
        export_path:
          type: string
          description: >-
            The planned export path. Execution publishes the rename target and
            reports the final path on the restore row.
        risks:
          type: array
          items:
            type: string
        plan_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        rehearsal_available:
          type: boolean
    Restore:
      type: object
      additionalProperties: false
      required:
        [id, backup_id, status, phase, plan, plan_digest, rehearse, verify_sql,
         requested_by, work_dir, export_path, export_bytes, created_at, started_at,
         finished_at, cancel_requested, error_class, error_code, side_effects,
         verify_status, verify_result]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: >-
            UUIDv7 bytes in lowercase hex without dashes, so the id itself is
            ordered by creation time and the list is newest first.
        backup_id:
          type: string
        status:
          $ref: '#/components/schemas/RestoreStatus'
        phase:
          allOf:
            - $ref: '#/components/schemas/RestorePhase'
          nullable: true
        plan:
          $ref: '#/components/schemas/RestorePlan'
        plan_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        rehearse:
          type: boolean
        verify_sql:
          type: array
          items:
            type: string
          description: >-
            The statements confirmed with the request, exactly as admitted by
            RestoreExecuteRequest.verify_sql.
        requested_by:
          type: string
        work_dir:
          type: string
          nullable: true
        export_path:
          type: string
          nullable: true
        export_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        cancel_requested:
          type: boolean
        error_class:
          allOf:
            - $ref: '#/components/schemas/RestoreErrorClass'
          nullable: true
        error_code:
          type: string
          nullable: true
        side_effects:
          allOf:
            - $ref: '#/components/schemas/RestoreSideEffects'
          nullable: true
        verify_status:
          $ref: '#/components/schemas/RestoreVerifyStatus'
        verify_result:
          type: object
          nullable: true
          additionalProperties: true
          description: Rehearsal detail. Null when no rehearsal ran.
    RestorePage:
      type: object
      additionalProperties: false
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restore'
        next_before:
          type: string
          nullable: true
    RestoreLog:
      type: object
      additionalProperties: false
      required: [restore_id, seq, ts, level, message, data]
      properties:
        restore_id:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Structured event payload. Null when the row has none.
    RestoreLogPage:
      type: object
      additionalProperties: false
      required: [items, next_after, truncated]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestoreLog'
        next_after:
          type: integer
          format: int64
          nullable: true
        truncated:
          type: boolean
          description: True when the log reached its cap and ends in the truncated marker.
    RestorePlanRequest:
      type: object
      additionalProperties: false
      required: [backup_id]
      properties:
        backup_id:
          type: string
          format: uuid
    RestoreExecuteRequest:
      type: object
      additionalProperties: false
      required: [backup_id, plan_digest, password]
      properties:
        backup_id:
          type: string
          format: uuid
        plan_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: Administrator password re-entry; never returned, logged or audited.
        rehearse:
          type: boolean
          default: false
        verify_sql:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: >-
            Read-only statements executed by the rehearsal, one per entry, in the
            restore engine's own bounds, which this document mirrors exactly: at
            most 16 entries, each 1 to 4096 bytes with no NUL byte, no inner
            statement separator (a single trailing ';' is allowed), and each
            starting with SELECT followed by a space, tab, line break or '('. An
            accepted request is therefore never refused later at claim time.
            Executed in a read-only transaction and never written to the audit.
    RestoreAccepted:
      type: object
      additionalProperties: false
      required: [restore_id]
      properties:
        restore_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
    RunLogEvent:
      type: object
      description: >-
        The fixed wire shape of one streamed SSE event's data; it omits run_id
        because the stream already names the run. Event names come from the
        dispatcher lifecycle: queued, claimed, preflight_ok, preflight_failed,
        started, completed, failed, canceled, interrupted, replication_enqueued,
        replication_step; the per-run log cap adds one final truncated marker.
        Heartbeats are ": ping" comments and the stream ends with an end event
        carrying the terminal status. data is the structured payload for that
        event and contains no secrets.
      additionalProperties: false
      required: [seq, ts, level, event, message, data]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        event:
          type: string
          minLength: 1
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Structured event payload. Null when the row has none.
    ReplicaStatus:
      type: string
      enum: [pending, uploading, uploaded, verified, failed, exhausted]
    Replica:
      type: object
      additionalProperties: false
      required: [backup_id, repository_id, status, attempts, next_attempt_at, uploaded_at, verified_at, alert_since, last_error_code, last_reply_code]
      properties:
        backup_id:
          type: string
        repository_id:
          type: string
        status:
          $ref: '#/components/schemas/ReplicaStatus'
        attempts:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        uploaded_at:
          type: string
          format: date-time
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        alert_since:
          type: string
          format: date-time
          nullable: true
        last_error_code:
          type: string
        last_reply_code:
          type: integer
    ReplicaPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Replica'
    Backup:
      type: object
      additionalProperties: false
      required: [id, chain_id, parent_id, kind, status, seq, from_lsn, to_lsn, last_lsn, object_path, payload_size, payload_sha256, local_present, completed_at, replicas]
      properties:
        id:
          type: string
        chain_id:
          type: string
        parent_id:
          type: string
        kind:
          type: string
          enum: [physical-full, physical-incremental]
        status:
          type: string
          enum: [running, completed, failed]
        seq:
          type: integer
          minimum: 1
        from_lsn:
          type: string
          description: Decimal text of the unsigned 64-bit LSN; empty when unset.
        to_lsn:
          type: string
        last_lsn:
          type: string
        object_path:
          type: string
        payload_size:
          type: integer
          format: int64
          minimum: 0
        payload_sha256:
          type: string
        local_present:
          type: boolean
        completed_at:
          type: string
          format: date-time
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/Replica'
    Chain:
      type: object
      additionalProperties: false
      required: [id, source_id, server_uuid, started_at, sealed_at, pinned, members]
      properties:
        id:
          type: string
        source_id:
          type: string
        server_uuid:
          type: string
        started_at:
          type: string
          format: date-time
        sealed_at:
          type: string
          format: date-time
        pinned:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
    ChainPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chain'
    Point:
      type: object
      additionalProperties: false
      required: [backup_id, chain_id, at]
      properties:
        repository_id:
          type: string
        backup_id:
          type: string
        chain_id:
          type: string
        at:
          type: string
          format: date-time
    Protection:
      type: object
      additionalProperties: false
      required: [local, remote]
      properties:
        local:
          allOf:
            - $ref: '#/components/schemas/Point'
          nullable: true
        remote:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        preflight:
          $ref: '#/components/schemas/PreflightResult'
        detail:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              minLength: 1
              description: >-
                The fixed machine code of a restore_refused error, for example
                backup_not_found, chain_broken, lsn_discontinuous,
                source_unavailable, tool_version_mismatch, matrix_unsupported,
                key_unavailable, insufficient_space, plan_changed or
                unconfigured.
        code:
          type: string
          enum: [bad_request, invalid_json, unsupported_media_type, payload_too_large, not_found, method_not_allowed, internal, unavailable, unauthorized, forbidden, cross_origin_rejected, rate_limited, conflict, validation_failed, preflight_failed, restore_refused, plan_changed, confirmation_failed]
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
